<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080b10;
    --surface: #0e1420;
    --surface2: #131b28;
    --border: #1e2d42;
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --green-glow: rgba(0,229,160,0.35);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --yellow: #ffd166;
    --blue: #3b82f6;
    --text: #e8f0fe;
    --muted: #5a7090;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    font-family: var(--font-display);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 0 0 1px rgba(0,229,160,0.05), 0 24px 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #00e5a0, #00c48c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--green-glow);
  }

  .header-text h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  .header-text p  { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }

  .network-badge {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    padding: 5px 10px;
    border-radius: 20px;
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(0,229,160,0.2);
    white-space: nowrap;
  }

  .divider { height: 1px; background: var(--border); margin-bottom: 20px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(6px);
    z-index: 1000;
    justify-content: center;
    align-items: flex-end;
  }

  .modal-overlay.open { display: flex; animation: overlayIn 0.22s ease; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 44px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
    position: relative;
    max-height: 92vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 18px;
  }

  .modal h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; text-align: center; }

  .modal-sub {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: var(--font-mono);
    text-align: center;
    margin-bottom: 20px;
  }

  .modal-close {
    position: absolute;
    top: 18px; right: 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: color 0.2s;
  }

  .modal-close:hover { color: var(--text); }

  .wallet-option {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 13px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    margin-bottom: 9px;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    font-family: var(--font-display);
    color: var(--text);
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .wallet-option:hover { border-color: var(--green); background: var(--green-dim); transform: translateY(-1px); }
  .wallet-option:active { transform: scale(0.98); }

  .wallet-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .wi-mm  { background: linear-gradient(135deg, #e2761b, #cd6116); }
  .wi-wc  { background: linear-gradient(135deg, #3b99fc, #2b7fd4); }
  .wi-cb  { background: linear-gradient(135deg, #1652f0, #0a3dc4); }
  .wi-tw  { background: linear-gradient(135deg, #3375bb, #245fa6); }
  .wi-btc { background: linear-gradient(135deg, #f7931a, #e07b10); }

  .wallet-info-text { flex: 1; min-width: 0; }

  .wallet-name { font-size: 0.92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wallet-desc { font-size: 0.68rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wallet-badge {
    margin-left: auto;
    font-size: 0.58rem;
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(0,229,160,0.2);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .wallet-badge.blue   { background: rgba(59,130,246,0.12);  color: #60a5fa; border-color: rgba(59,130,246,0.2); }
  .wallet-badge.orange { background: rgba(247,147,26,0.12); color: #fb923c; border-color: rgba(247,147,26,0.2); }

  .wallet-section-label {
    font-size: 0.62rem;
    font-family: var(--font-mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 14px 0 8px;
  }

  /* ── FORM ── */
  label {
    display: block;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .input-wrap { position: relative; margin-bottom: 16px; }

  .input-wrap input {
    width: 100%;
    padding: 14px 16px;
    padding-right: 76px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: max(16px, 1rem);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  .input-wrap input::placeholder { color: var(--muted); }

  .input-unit {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--green);
    font-weight: 500;
    pointer-events: none;
  }

  .receiver-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }

  .rx-label { font-size: 0.62rem; font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; flex-shrink: 0; }
  .rx-addr  { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text); opacity: 0.8; word-break: break-all; min-width: 0; }

  /* ── BUTTONS ── */
  .btn {
    width: 100%; padding: 15px; margin-bottom: 10px;
    border: none; border-radius: 14px;
    font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

  .btn-connect { background: linear-gradient(135deg, #00e5a0, #00b87d); color: #061a11; box-shadow: 0 4px 24px rgba(0,229,160,0.3); }
  .btn-connect:hover:not(:disabled) { box-shadow: 0 6px 32px rgba(0,229,160,0.5); transform: translateY(-1px); }

  .btn-pay { background: linear-gradient(135deg, #00e5a0, #00b87d); color: #061a11; box-shadow: 0 4px 24px rgba(0,229,160,0.3); }
  .btn-pay:hover:not(:disabled) { box-shadow: 0 6px 32px rgba(0,229,160,0.5); transform: translateY(-1px); }
  .btn-pay::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: skewX(-20deg); transition: left 0.5s; }
  .btn-pay:not(:disabled):hover::after { left: 160%; }

  .btn-disconnect { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,77,109,0.25); }
  .btn-disconnect:hover { background: rgba(255,77,109,0.2); box-shadow: 0 4px 16px rgba(255,77,109,0.2); }

  /* ── RESULT ── */
  .result {
    margin-top: 4px; padding: 14px 16px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 14px;
    min-height: 80px;
    font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.65;
    word-break: break-all; color: var(--muted);
    transition: border-color 0.3s;
  }

  .result.active      { border-color: rgba(0,229,160,0.3); }
  .result.error-state { border-color: rgba(255,77,109,0.3); }

  .success { color: var(--green); font-weight: 500; }
  .error   { color: var(--red);   font-weight: 500; }
  .warn    { color: var(--yellow); font-weight: 500; }

  .tx-hash { display: inline-block; margin-top: 6px; color: var(--green); opacity: 0.8; font-size: 0.7rem; }
  .tx-hash a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

  .spinner {
    display: inline-block; width: 11px; height: 11px;
    border: 2px solid var(--green-dim); border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 7px; vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .wallet-info {
    align-items: center; gap: 8px; margin-bottom: 14px; padding: 10px 14px;
    background: var(--green-dim); border: 1px solid rgba(0,229,160,0.2); border-radius: 12px;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--green);
    display: none; overflow: hidden;
  }

  .wallet-info.show { display: flex; }

  .wallet-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* WalletConnect Modal override styles */
  #wcm-modal-container, wcm-modal { z-index: 9999 !important; }

  @media (max-width: 480px) {
    body { padding: 0; align-items: flex-end; }
    .card { border-radius: 20px 20px 0 0; padding: 22px 18px 30px; max-width: 100%; box-shadow: none; border-bottom: none; }
    .header { margin-bottom: 16px; }
    .header-text h2 { font-size: 1.1rem; }
    .network-badge { font-size: 0.6rem; padding: 4px 8px; }
    .btn { padding: 16px; font-size: 1rem; }
    .modal { padding: 22px 16px 44px; }
    .wallet-option { padding: 12px 12px; gap: 11px; }
    .wallet-icon { width: 34px; height: 34px; font-size: 17px; border-radius: 8px; }
    .wallet-name { font-size: 0.85rem; }
    .wallet-desc { font-size: 0.64rem; }
  }

  @media (min-width: 481px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 24px; max-width: 400px; }
    .modal-handle { display: none; }
  }
</style>
</head>

<script type="module">
import { createWeb3Modal, defaultConfig } from 'https://esm.sh/@web3modal/ethers5@4.2.3';

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const WC_PROJECT_ID    = "08c159f4699e9b22371f9d0d4ce1aef8";
const RECEIVER         = "0xf2BcDD45Dd5D6AAf1718CdE1CEeA169A870ea4eB";
const VERSE_TOKEN      = "0xc708D6F2153933DAA50B2D0758955Be0A93A8FEc";
const POLYGON_CHAIN_ID = 137;
const POLYGON_HEX      = "0x89";

const ERC20_ABI = [
  "function transfer(address to, uint256 amount) returns (bool)",

  name: "VersePay",
  description: "Pay with VERSE on Polygon",
  url: window.location.origin,
  icons: ["https://avatars.githubusercontent.com/u/37784886"]
};

// Init Web3Modal (AppKit)

  ethersConfig: defaultConfig({ metadata }),
  chains: [polygon],
  projectId: WC_PROJECT_ID,
  themeMode: "dark",
  themeVariables: {
    "--w3m-accent": "#00e5a0",
    "--w3m-border-radius-master": "12px",
    "--w3m-font-family": "'Syne', sans-serif",
    "--w3m-color-mix": "#00e5a0",
    "--w3m-color-mix-strength": 20
  },
  featuredWalletIds: [
    "c57ca95b47569778a828d19178114f4db188b89b763c899ba0be274e97267d96", // MetaMask
    "4622a2b2d6af1c9844944291e5e7351a6aa24cd7b23099efac1b2fd875da31a0", // Trust
    "fd20dc426fb37566d803205b19bbc1d4096b248ac04548e3cfb6b3a38bd033aa", // Bitcoin.com
    "a797aa35c0fadbfc1a53e7f675162ed5226968b44a19ee3d24385c64d1d3c393", // Phantom
    "1ae92b26df02f0abca6304df07debccd18262fdf5fe82daa81593582dac9a369", // Rainbow
  ],
  enableAnalytics: false
});

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let userAddress = null;
let wcProvider  = null;
let wcSigner    = null;
const isMobile  = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
const pageHost  = window.location.host + window.location.pathname;
const pageURL   = encodeURIComponent(window.location.href);

// ═══════════════════════════════════════════
// ELEMENTS
// ═══════════════════════════════════════════
const resultDiv      = document.getElementById("result");
const connectBtn     = document.getElementById("connectBtn");
const payBtn         = document.getElementById("payBtn");
const disconnectBtn  = document.getElementById("disconnectBtn");
const walletInfoBar  = document.getElementById("walletInfo");
const walletAddrSpan = document.getElementById("walletAddr");
const modalOverlay   = document.getElementById("modalOverlay");

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function setResult(html, type = "") {
  resultDiv.innerHTML = html;
  resultDiv.className = "result" + (type ? " " + type : "");
}

function shortAddr(addr) {
  return addr.slice(0, 6) + "…" + addr.slice(-4);
}

function openModal() {
  modalOverlay.classList.add("open");
  // Update badges
  const mmBadge = document.getElementById("metamaskBadge");
  const cbBadge = document.getElementById("coinbaseBadge");
  if (window.ethereum?.isMetaMask) { mmBadge.textContent = "✓ Detected"; mmBadge.className = "wallet-badge"; }
  else { mmBadge.textContent = isMobile ? "Get App" : "Install"; }
  if (window.ethereum?.isCoinbaseWallet || window.coinbaseWalletExtension) { cbBadge.textContent = "✓ Detected"; cbBadge.className = "wallet-badge"; }
  else { cbBadge.textContent = isMobile ? "Get App" : "Install"; }
}

function closeModal() { modalOverlay.classList.remove("open"); }

async function ensurePolygon(eth) {
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: POLYGON_HEX }] });
  } catch (e) {
    if (e.code === 4902) {
      await eth.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: POLYGON_HEX,
          chainName: "Polygon Mainnet",
          nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
          rpcUrls: ["https://polygon-rpc.com/"],
          blockExplorerUrls: ["https://polygonscan.com/"]
        }]
      });
    } else throw e;
  }
}

async function finaliseInjected(eth) {
  closeModal();
  setResult(`<span class="warn"><span class="spinner"></span>Switching to Polygon...</span>`);
  await ensurePolygon(eth);

  wcProvider = new ethers.providers.Web3Provider(eth, "any");
  wcSigner   = wcProvider.getSigner();

  const network = await wcProvider.getNetwork();
  if (network.chainId !== POLYGON_CHAIN_ID) {
    setResult(`<span class="error">❌ Please switch to Polygon Mainnet in your wallet.</span>`, "error-state");
    return;
  }

  userAddress = await wcSigner.getAddress();
  onConnected(shortAddr(userAddress) + " · Polygon");

  eth.on("accountsChanged", (accs) => { if (!accs.length) onDisconnected(); else { userAddress = accs[0]; walletAddrSpan.textContent = shortAddr(userAddress) + " · Polygon"; } });
  eth.on("chainChanged", () => window.location.reload());
}

function onConnected(label) {
  connectBtn.style.display    = "none";
  disconnectBtn.style.display = "block";
  payBtn.disabled             = false;
  walletInfoBar.classList.add("show");
  walletAddrSpan.textContent  = label;
  setResult(`<span class="success">✅ Wallet connected!</span><br>${userAddress}`, "active");
}

function onDisconnected() {
  userAddress = null; wcProvider = null; wcSigner = null;
  connectBtn.style.display    = "block";
  disconnectBtn.style.display = "none";
  payBtn.disabled             = true;
  walletInfoBar.classList.remove("show");
  setResult("Wallet disconnected. Connect to continue.");
}

// ═══════════════════════════════════════════
// WALLETCONNECT (Web3Modal) — opens native modal with all wallets
// ═══════════════════════════════════════════
document.getElementById("walletConnectBtn").addEventListener("click", async () => {
  closeModal();
  try {
    await modal.open();
  } catch(e) {
    setResult(`<span class="error">❌ ${e.message}</span>`, "error-state");
  }
});

// Listen for Web3Modal connection events
modal.subscribeProvider(({ provider, providerType, address, isConnected, chainId }) => {
  if (isConnected && provider && address) {
    wcProvider  = new ethers.providers.Web3Provider(provider, "any");
    wcSigner    = wcProvider.getSigner();
    userAddress = address;
    onConnected(shortAddr(address) + " · " + (providerType || "WalletConnect"));
  } else if (!isConnected && userAddress) {
    onDisconnected();
  }
});

// ═══════════════════════════════════════════
// PAY NOW
// ═══════════════════════════════════════════
async function payNow() {
  if (!userAddress || !wcSigner) {
    setResult(`<span class="error">❌ Connect your wallet first.</span>`, "error-state");
    return;
  }

  const rawAmount = document.getElementById("amount").value;
  if (!rawAmount || Number(rawAmount) <= 0) {
    setResult(`<span class="error">❌ Enter a valid VERSE amount.</span>`, "error-state");
    return;
  }

  try {
    setResult(`<span class="warn"><span class="spinner"></span>Loading token info...</span>`);

    // Refresh provider
    if (modal.getWalletProvider && typeof modal.getWalletProvider === 'function') {
      const p = modal.getWalletProvider();
      if (p) { wcProvider = new ethers.providers.Web3Provider(p, "any"); wcSigner = wcProvider.getSigner(); }
    }

    const token    = new ethers.Contract(VERSE_TOKEN, ERC20_ABI, wcSigner);
    const decimals = await token.decimals();
    const value    = ethers.utils.parseUnits(rawAmount, decimals);

    setResult(`<span class="warn"><span class="spinner"></span>Checking VERSE balance...</span>`);
    const balance = await token.balanceOf(userAddress);

    if (balance.lt(value)) {
      const humanBal = ethers.utils.formatUnits(balance, decimals);
      setResult(`<span class="error">❌ Insufficient VERSE balance.<br>Your balance: ${parseFloat(humanBal).toFixed(4)} VERSE</span>`, "error-state");
      return;
    }

    setResult(`<span class="warn"><span class="spinner"></span>Waiting for wallet approval...</span>`);
    const tx = await token.transfer(RECEIVER, value);

    setResult(`<span class="warn"><span class="spinner"></span>Confirming on-chain...<br>
      <span class="tx-hash">TX: <a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">${shortAddr(tx.hash)}</a></span></span>`);

    const receipt = await tx.wait(1);

    if (receipt.status === 1) {
      setResult(
        `<span class="success">✅ Payment Successful!</span><br>
        Sent: <strong>${rawAmount} VERSE</strong><br>
        To: ${shortAddr(RECEIVER)}<br>
        <span class="tx-hash">TX: <a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">${tx.hash}</a></span>`,
        "active"
      );
    } else {
      setResult(`<span class="error">❌ Transaction reverted.<br><span class="tx-hash"><a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">View on Polygonscan ↗</a></span></span>`, "error-state");
    }

  } catch (err) {
    if (err.code === 4001 || err.code === "ACTION_REJECTED") {
      setResult(`<span class="error">❌ Transaction rejected by user.</span>`, "error-state");
    } else if (err.code === "INSUFFICIENT_FUNDS") {
      setResult(`<span class="error">❌ Not enough MATIC for gas fees.</span>`, "error-state");
    } else {
      const msg = err.reason || err.data?.message || err.message || "Unknown error";
      setResult(`<span class="error">❌ ${msg}</span>`, "error-state");
      console.error("Payment error:", err);
    }
  }
}

async function disconnectWallet() {

}
