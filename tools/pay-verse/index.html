<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080b10;
    --surface: #0e1420;
    --surface2: #131b28;
    --border: #1e2d42;
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --green-glow: rgba(0,229,160,0.35);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --yellow: #ffd166;
    --text: #e8f0fe;
    --muted: #5a7090;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    font-family: var(--font-display);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* ── CARD ── */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 0 0 1px rgba(0,229,160,0.05), 0 24px 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HEADER ── */
  .header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 22px;
  }

  .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, #00e5a0, #00c48c);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 0 20px var(--green-glow);
  }

  .header-text h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  .header-text p  { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }

  .network-badge {
    margin-left: auto;
    font-family: var(--font-mono); font-size: 0.65rem;
    padding: 5px 10px; border-radius: 20px;
    background: var(--green-dim); color: var(--green);
    border: 1px solid rgba(0,229,160,0.2); white-space: nowrap;
  }

  .divider { height: 1px; background: var(--border); margin-bottom: 20px; }

  /* ── WALLET INFO BAR ── */
  .wallet-info {
    align-items: center; gap: 8px; margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--green-dim); border: 1px solid rgba(0,229,160,0.2);
    border-radius: 12px;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--green);
    display: none; overflow: hidden;
  }
  .wallet-info.show { display: flex; }

  .wallet-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
    flex-shrink: 0; animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── FORM ── */
  label {
    display: block; font-size: 0.7rem;
    font-family: var(--font-mono); color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 7px;
  }

  .input-wrap { position: relative; margin-bottom: 16px; }

  .input-wrap input {
    width: 100%; padding: 14px 16px; padding-right: 76px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); font-family: var(--font-mono);
    /* 16px min prevents iOS auto-zoom on focus */
    font-size: max(16px, 1rem);
    outline: none; -webkit-appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  .input-wrap input::placeholder { color: var(--muted); }

  .input-unit {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 0.78rem;
    color: var(--green); font-weight: 500; pointer-events: none;
  }

  .receiver-box {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 14px; padding: 11px 14px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px; overflow: hidden;
  }
  .rx-label { font-size: 0.62rem; font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; flex-shrink: 0; }
  .rx-addr  { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text); opacity: 0.8; word-break: break-all; min-width: 0; }

  /* ── BUTTONS ── */
  .btn {
    width: 100%; padding: 15px; margin-bottom: 10px;
    border: none; border-radius: 14px;
    font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; user-select: none;
  }
  .btn:active { transform: scale(0.97) !important; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  .btn-connect, .btn-pay {
    background: linear-gradient(135deg, #00e5a0, #00b87d);
    color: #061a11; box-shadow: 0 4px 24px rgba(0,229,160,0.3);
  }
  .btn-connect:hover:not(:disabled),
  .btn-pay:hover:not(:disabled) { box-shadow: 0 6px 32px rgba(0,229,160,0.5); transform: translateY(-1px); }

  /* shimmer */
  .btn-pay::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-20deg); transition: left 0.5s;
  }
  .btn-pay:not(:disabled):hover::after { left: 160%; }

  .btn-disconnect { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,77,109,0.25); }
  .btn-disconnect:hover { background: rgba(255,77,109,0.2); box-shadow: 0 4px 16px rgba(255,77,109,0.2); }

  /* ── RESULT LOG ── */
  .result {
    margin-top: 4px; padding: 14px 16px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 14px;
    min-height: 80px;
    font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.65;
    word-break: break-all; color: var(--muted); transition: border-color 0.3s;
  }
  .result.active      { border-color: rgba(0,229,160,0.3); }
  .result.error-state { border-color: rgba(255,77,109,0.3); }

  .success { color: var(--green); font-weight: 500; }
  .error   { color: var(--red);   font-weight: 500; }
  .warn    { color: var(--yellow); font-weight: 500; }

  .tx-hash { display: inline-block; margin-top: 6px; color: var(--green); opacity: 0.8; font-size: 0.7rem; }
  .tx-hash a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

  .spinner {
    display: inline-block; width: 11px; height: 11px;
    border: 2px solid var(--green-dim); border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 7px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════════════════════════════════════════
     WALLET MODAL
  ══════════════════════════════════════════ */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(7px);
    z-index: 1000;
    justify-content: center; align-items: flex-end;
  }
  .modal-overlay.open { display: flex; animation: overlayIn 0.22s ease; }
  @keyframes overlayIn { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px env(safe-area-inset-bottom, 32px);
    width: 100%; max-width: 480px; margin: 0 auto;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
    position: relative;
    max-height: 92vh; max-height: 92dvh;
    overflow-y: auto;
  }
  @keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }

  .modal-drag {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0 auto 16px;
  }

  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-head h3 { font-size: 1.05rem; font-weight: 800; }
  .modal-head p  { font-size: 0.68rem; color: var(--muted); font-family: var(--font-mono); margin-top: 3px; }

  .modal-close {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s; margin-left: 12px;
  }
  .modal-close:hover { color: var(--text); }

  /* Section label */
  .wsec {
    font-size: 0.6rem; font-family: var(--font-mono);
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
    margin: 14px 0 7px;
  }
  .wsec:first-of-type { margin-top: 0; }

  /* Wallet row */
  .wopt {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px 13px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 14px; cursor: pointer; margin-bottom: 8px;
    transition: border-color 0.18s, background 0.18s, transform 0.12s;
    font-family: var(--font-display); color: var(--text); text-align: left;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .wopt:hover  { border-color: var(--green); background: var(--green-dim); transform: translateY(-1px); }
  .wopt:active { transform: scale(0.975); }

  /* WalletConnect hero button */
  .wopt-hero {
    background: linear-gradient(135deg, rgba(59,153,252,0.14), rgba(43,127,212,0.08));
    border-color: rgba(59,153,252,0.3);
  }
  .wopt-hero:hover { border-color: rgba(59,153,252,0.6); background: rgba(59,153,252,0.2); transform: translateY(-1px); }

  .wopt-icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .wi-mm  { background: linear-gradient(135deg,#e2761b,#cd6116); }
  .wi-wc  { background: linear-gradient(135deg,#3b99fc,#2b7fd4); }
  .wi-cb  { background: linear-gradient(135deg,#1652f0,#0a3dc4); }
  .wi-tw  { background: linear-gradient(135deg,#3375bb,#245fa6); }
  .wi-btc { background: linear-gradient(135deg,#f7931a,#e07b10); }

  .wopt-text { flex: 1; min-width: 0; }
  .wopt-name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wopt-desc { font-size: 0.65rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wbadge {
    margin-left: auto; font-size: 0.56rem; font-family: var(--font-mono);
    padding: 3px 7px; border-radius: 20px; flex-shrink: 0;
    background: var(--green-dim); color: var(--green);
    border: 1px solid rgba(0,229,160,0.2); white-space: nowrap;
  }
  .wbadge.blue   { background: rgba(59,130,246,0.12); color: #60a5fa; border-color: rgba(59,130,246,0.2); }
  .wbadge.orange { background: rgba(247,147,26,0.12); color: #fb923c; border-color: rgba(247,147,26,0.2); }
  .wbadge.found  { background: var(--green-dim); color: var(--green); }

  /* Force WalletConnect modal on top */
  w3m-modal, #w3m-modal, [id^="w3m"] { z-index: 99999 !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    body { padding: 0; align-items: flex-end; }
    .card {
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 24px;
      max-width: 100%; box-shadow: none; border-bottom: none;
    }
    .header { margin-bottom: 16px; }
    .header-text h2 { font-size: 1.1rem; }
    .network-badge { font-size: 0.6rem; padding: 4px 8px; }
    .btn { padding: 16px; font-size: 1rem; }
    .modal { padding: 18px 16px env(safe-area-inset-bottom, 28px); }
    .wopt { padding: 11px 12px; }
    .wopt-icon { width: 36px; height: 36px; font-size: 18px; border-radius: 9px; }
    .wopt-name { font-size: 0.85rem; }
    .wopt-desc { font-size: 0.62rem; }
  }

  @media (min-width: 481px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 24px; max-width: 400px; padding-bottom: 24px; }
    .modal-drag { display: none; }
  }
</style>
</head>

const $result     = document.getElementById('result');
const $connectBtn = document.getElementById('connectBtn');
const $payBtn     = document.getElementById('payBtn');
const $discBtn    = document.getElementById('disconnectBtn');
const $wInfo      = document.getElementById('walletInfo');
const $wAddr      = document.getElementById('walletAddr');
const $overlay    = document.getElementById('modalOverlay');

// ─────────────────────────────────────────
// WEB3MODAL (standalone — just the UI shell)
// ─────────────────────────────────────────
const web3modal = new Web3Modal({
  projectId: PROJECT_ID,
  walletConnectVersion: 2,
  themeMode: 'dark',
  themeVariables: {
    '--w3m-accent-color':           '#00e5a0',
    '--w3m-accent-fill-color':      '#061a11',
    '--w3m-background-color':       '#0e1420',
    '--w3m-container-border-radius':'20px',
    '--w3m-font-family':            "'Syne', sans-serif",
    '--w3m-z-index':                '99999',
  },
  explorerRecommendedWalletIds: [
    'fd20dc426fb37566d803205b19bbc1d4096b248ac04548e3cfb6b3a38bd033aa', // Bitcoin.com
    'c57ca95b47569778a828d19178114f4db188b89b763c899ba0be274e97267d96', // MetaMask
    '4622a2b2d6af1c9844944291e5e7351a6aa24cd7b23099efac1b2fd875da31a0', // Trust
    '1ae92b26df02f0abca6304df07debccd18262fdf5fe82daa81593582dac9a369', // Rainbow
    'a797aa35c0fadbfc1a53e7f675162ed5226968b44a19ee3d24385c64d1d3c393', // Phantom
  ],
  explorerExcludedWalletIds: 'ALL', // show only recommended
});

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function setResult(html, cls = '') {
  $result.innerHTML = html;
  $result.className = 'result' + (cls ? ' ' + cls : '');
}
function shortAddr(a) { return a.slice(0,6) + '…' + a.slice(-4); }
function sp() { return `<span class="spinner"></span>`; }

function onConnected(label) {
  $connectBtn.style.display = 'none';
  $discBtn.style.display    = 'block';
  $payBtn.disabled          = false;
  $wInfo.classList.add('show');
  $wAddr.textContent        = label;
  setResult(`<span class="success">✅ Wallet connected!</span><br>${userAddress}`, 'active');
}

function onDisconnected() {
  userAddress = null; ethProvider = null; ethSigner = null; wcProvider = null;
  $connectBtn.style.display = 'block';
  $discBtn.style.display    = 'none';
  $payBtn.disabled          = true;
  $wInfo.classList.remove('show');
  setResult('Wallet disconnected. Connect to continue.');
}

function openMyModal() {
  $overlay.classList.add('open');

  // Live detection badges
  const mmBadge = document.getElementById('mmBadge');
  const mmDesc  = document.getElementById('mmDesc');
  const cbBadge = document.getElementById('cbBadge');
  const cbDesc  = document.getElementById('cbDesc');

  if (window.ethereum?.isMetaMask) {
    mmBadge.textContent = '✓ Detected'; mmBadge.className = 'wbadge found';
    mmDesc.textContent  = 'Click to connect';
  } else if (isMobile) {
    mmBadge.textContent = 'Open App'; mmBadge.className = 'wbadge blue';
    mmDesc.textContent  = 'Tap to open MetaMask app';
  } else {
    mmBadge.textContent = 'Install'; mmBadge.className = 'wbadge';
    mmDesc.textContent  = 'Not detected — click to install';
  }

  const hasCB = window.coinbaseWalletExtension || window.ethereum?.isCoinbaseWallet;
  if (hasCB) {
    cbBadge.textContent = '✓ Detected'; cbBadge.className = 'wbadge found';
    cbDesc.textContent  = 'Click to connect';
  } else if (isMobile) {
    cbBadge.textContent = 'Open App'; cbBadge.className = 'wbadge blue';
    cbDesc.textContent  = 'Tap to open Coinbase Wallet';
  } else {
    cbBadge.textContent = 'Install'; cbBadge.className = 'wbadge';
    cbDesc.textContent  = 'Not detected — click to install';
  }
}

function closeMyModal() { $overlay.classList.remove('open'); }

// ─────────────────────────────────────────
// POLYGON HELPER
// ─────────────────────────────────────────
async function ensurePolygon(eth) {
  try {
    await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: POLYGON_HEX }] });
  } catch(e) {
    if (e.code === 4902) {
      await eth.request({ method: 'wallet_addEthereumChain', params: [POLYGON_RPC] });
    } else throw e;
  }
}

// ─────────────────────────────────────────
// INJECTED WALLET (MetaMask / Coinbase / in-app browser)
// ─────────────────────────────────────────
async function connectInjected(eth) {
  closeMyModal();
  try {
    setResult(`<span class="warn">${sp()}Requesting wallet access…</span>`);
    await eth.request({ method: 'eth_requestAccounts' });

    setResult(`<span class="warn">${sp()}Switching to Polygon…</span>`);
    await ensurePolygon(eth);

    ethProvider = new ethers.providers.Web3Provider(eth, 'any');
    ethSigner   = ethProvider.getSigner();

    const net = await ethProvider.getNetwork();
    if (net.chainId !== POLYGON_CHAIN_ID) {
      setResult(`<span class="error">❌ Please switch to Polygon Mainnet in your wallet.</span>`, 'error-state');
      return;
    }

    userAddress = await ethSigner.getAddress();
    onConnected(shortAddr(userAddress) + ' · Polygon');

    eth.on('accountsChanged', accs => {
      if (!accs.length) onDisconnected();
      else { userAddress = accs[0]; $wAddr.textContent = shortAddr(accs[0]) + ' · Polygon'; }
    });
    eth.on('chainChanged', () => location.reload());

  } catch(e) {
    const msg = e.code === 4001 ? 'Rejected by user.' : (e.message || 'Connection failed.');
    setResult(`<span class="error">❌ ${msg}</span>`, 'error-state');
  }
}

// ─────────────────────────────────────────
// WALLETCONNECT v2 — real modal + QR
// ─────────────────────────────────────────
async function connectWalletConnect() {
  closeMyModal();
  setResult(`<span class="warn">${sp()}Initialising WalletConnect…</span>`);

  try {
    // Disconnect any stale session first
    if (wcProvider) {
      try { await wcProvider.disconnect(); } catch(_) {}
      wcProvider = null;
    }

    // Create a fresh EthereumProvider
    wcProvider = await EthereumProvider.init({
      projectId:      PROJECT_ID,
      chains:         [POLYGON_CHAIN_ID],
      optionalChains: [POLYGON_CHAIN_ID],
      showQrModal:    false,   // we drive the modal ourselves via web3modal standalone
      metadata: {
        name:        'VersePay',
        description: 'Pay with VERSE on Polygon',
        url:         window.location.origin,
        icons:       ['https://avatars.githubusercontent.com/u/37784886']
      }
    });

    // Pipe WC URI into Web3Modal standalone so it renders the wallet picker / QR
    wcProvider.on('display_uri', async (uri) => {
      setResult(`<span class="warn">${sp()}Opening wallet picker…</span>`);
      await web3modal.openModal({ uri, standaloneChains: [`eip155:${POLYGON_CHAIN_ID}`] });
    });

    wcProvider.on('connect', () => {
      web3modal.closeModal();
    });

    wcProvider.on('disconnect', () => {
      web3modal.closeModal();
      onDisconnected();
    });

    wcProvider.on('accountsChanged', accs => {
      if (!accs.length) onDisconnected();
      else { userAddress = accs[0]; $wAddr.textContent = shortAddr(accs[0]) + ' · WalletConnect'; }
    });

    wcProvider.on('chainChanged', () => {
      // Refresh provider on chain change
      ethProvider = new ethers.providers.Web3Provider(wcProvider, 'any');
      ethSigner   = ethProvider.getSigner();
    });

    setResult(`<span class="warn">${sp()}Select your wallet from the popup…</span>`);
    await wcProvider.connect({ chains: [POLYGON_CHAIN_ID] });

    ethProvider = new ethers.providers.Web3Provider(wcProvider, 'any');
    ethSigner   = ethProvider.getSigner();

    const accounts = await ethProvider.listAccounts();
    if (!accounts.length) throw new Error('No accounts returned from wallet.');
    userAddress = accounts[0];

    onConnected(shortAddr(userAddress) + ' · WalletConnect');

  } catch(e) {
    web3modal.closeModal();
    const msg = (e.message || '').toLowerCase();
    if (msg.includes('user rejected') || msg.includes('cancelled') || msg.includes('closed') || e.code === 4001) {
      setResult(`<span class="error">❌ Connection cancelled.</span>`, 'error-state');
    } else {
      setResult(`<span class="error">❌ WalletConnect: ${e.message || 'Failed to connect.'}</span>`, 'error-state');
      console.error('WC error:', e);
    }
  }
}

// ─────────────────────────────────────────
// BUTTON HANDLERS
// ─────────────────────────────────────────

// WalletConnect
document.getElementById('wcBtn').addEventListener('click', connectWalletConnect);

// Bitcoin.com Wallet
document.getElementById('btcBtn').addEventListener('click', () => {
  // If already inside the Bitcoin.com in-app browser
  if (window.ethereum) { connectInjected(window.ethereum); return; }
  closeMyModal();
  if (isMobile) {
    setResult(`<span class="warn">📱 Opening Bitcoin.com Wallet…</span>`);
    window.location.href = `bitcoincom://browser?url=${pageURL}`;
    setTimeout(() => {
      window.open('https://wallet.bitcoin.com/', '_blank');
      setResult(`<span class="warn">📱 If the app didn't open, copy this page's URL and paste it into the Bitcoin.com Wallet browser tab.</span>`);
    }, 2000);
  } else {
    // Desktop — use WalletConnect; Bitcoin.com is featured in the picker
    connectWalletConnect();
  }
});

// Trust Wallet
document.getElementById('twBtn').addEventListener('click', () => {

  }

// ─────────────────────────────────────────
// PAY NOW
// ─────────────────────────────────────────
async function payNow() {
  if (!userAddress || !ethSigner) {
    setResult(`<span class="error">❌ Connect your wallet first.</span>`, 'error-state');
    return;
  }

  const rawAmount = document.getElementById('amount').value;
  if (!rawAmount || Number(rawAmount) <= 0) {
    setResult(`<span class="error">❌ Enter a valid VERSE amount.</span>`, 'error-state');
    return;
  }

  try {
    setResult(`<span class="warn">${sp()}Loading token info…</span>`);
    const token    = new ethers.Contract(VERSE_TOKEN, ERC20_ABI, ethSigner);
    const decimals = await token.decimals();
    const value    = ethers.utils.parseUnits(rawAmount, decimals);

    setResult(`<span class="warn">${sp()}Checking VERSE balance…</span>`);
    const balance = await token.balanceOf(userAddress);
    if (balance.lt(value)) {
      const bal = parseFloat(ethers.utils.formatUnits(balance, decimals)).toFixed(4);
      setResult(`<span class="error">❌ Insufficient VERSE balance.<br>Your balance: ${bal} VERSE</span>`, 'error-state');
      return;
    }

    setResult(`<span class="warn">${sp()}Waiting for wallet approval…</span>`);
    const tx = await token.transfer(RECEIVER, value);

    setResult(`<span class="warn">${sp()}Confirming on-chain…<br>
      <span class="tx-hash">TX: <a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">${shortAddr(tx.hash)}</a></span></span>`);

    const receipt = await tx.wait(1);

    if (receipt.status === 1) {
      setResult(
        `<span class="success">✅ Payment Successful!</span><br>
         Sent: <strong>${rawAmount} VERSE</strong><br>
         To: ${shortAddr(RECEIVER)}<br>
         <span class="tx-hash">TX: <a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">${tx.hash}</a></span>`,
        'active'
      );
    } else {
      setResult(
        `<span class="error">❌ Transaction reverted.<br>
         <span class="tx-hash"><a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">View on Polygonscan ↗</a></span></span>`,
        'error-state'
      );
    }

  } catch(err) {
    if (err.code === 4001 || err.code === 'ACTION_REJECTED') {
      setResult(`<span class="error">❌ Transaction rejected by user.</span>`, 'error-state');
    } else if (err.code === 'INSUFFICIENT_FUNDS') {
      setResult(`<span class="error">❌ Not enough MATIC for gas fees. Top up MATIC on Polygon.</span>`, 'error-state');
    } else {
      const msg = err.reason || err.data?.message || err.message || 'Unknown error';
      setResult(`<span class="error">❌ ${msg}</span>`, 'error-state');
      console.error('Pay error:', err);
    }
  }
}

// ─────────────────────────────────────────
// DISCONNECT
// ─────────────────────────────────────────
async function disconnectWallet() {
  try {
    if (wcProvider?.disconnect) await wcProvider.disconnect();
  } catch(_) {}
  onDisconnected();
}

// ─────────────────────────────────────────
// WIRE EVENTS
// ─────────────────────────────────────────
$connectBtn.addEventListener('click', openMyModal);
$payBtn.addEventListener('click', payNow);
$discBtn.addEventListener('click', disconnectWallet);
document.getElementById('modalClose').addEventListener('click', closeMyModal);
$overlay.addEventListener('click', e => { if (e.target === $overlay) closeMyModal(); });

</script>
