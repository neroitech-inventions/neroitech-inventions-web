<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detect your public IP address and basic location info.">
  <title>My IP Address</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM106YDX6N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QM106YDX6N');
  </script>

  <link href="images/favicon.ico" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --bg-elevated: #0c1018;
      --card: #111827;
      --border: rgba(148, 163, 184, 0.1);
      --border-strong: rgba(148, 163, 184, 0.18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --success: #34d399;
      --error: #f87171;
      --radius: 20px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }

    html { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.11), transparent),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(56, 189, 248, 0.06), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* Header */
    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #22d3ee, #38bdf8);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(34, 211, 238, 0.25);
    }
    .icon svg {
      width: 26px;
      height: 26px;
      stroke: #07090f;
      stroke-width: 2.1;
      fill: none;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #e0f2fe, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* IP display */
    .ip-box {
      background: var(--accent-soft);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 14px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }
    .ip-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .ip-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.5rem, 5vw, 2.05rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.3;
    }

    /* Details */
    .details {
      display: none;
      text-align: left;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 0;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .details.show { display: block; }
    .details p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .details p:last-child { border-bottom: none; }
    .details span:first-child {
      color: var(--dim);
      font-weight: 500;
      flex-shrink: 0;
    }
    .details span:last-child {
      color: var(--text);
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      padding: 12px 22px;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22d3ee, #38bdf8);
      color: #07090f;
      box-shadow: 0 4px 16px rgba(34, 211, 238, 0.25);
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border-strong);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }
    .btn-ghost.copied {
      color: var(--success);
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.1);
    }

    .status {
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--dim);
      min-height: 1.2em;
    }
    .status.error { color: var(--error); }

    /* Powered by */
    .powered {
      margin-top: 26px;
      font-size: 0.8rem;
      color: var(--dim);
    }
    .powered a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .powered a:hover { text-decoration: underline; }
    .powered svg {
      width: 13px;
      height: 13px;
    }

    @media (max-width: 420px) {
      .card { padding: 28px 18px 22px; }
      .ip-display { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </div>

    <h1>Your IP Address</h1>
    <p class="subtitle">Detects your public IP and basic location info</p>

    <div class="ip-box">
      <div class="ip-label">Public IP</div>
      <div class="ip-display" id="ip">Detecting…</div>
    </div>

    <div class="details" id="details">
      <p><span>City</span> <span id="city">—</span></p>
      <p><span>Region</span> <span id="region">—</span></p>
      <p><span>Country</span> <span id="country">—</span></p>
      <p><span>ISP / Org</span> <span id="org">—</span></p>
      <p><span>Timezone</span> <span id="timezone">—</span></p>
    </div>

    <div class="actions">
      <button class="btn-primary" id="refresh">Refresh</button>
      <button class="btn-ghost" id="copyBtn" type="button">Copy IP</button>
    </div>

    <div class="status" id="status"></div>

    <div class="powered">
      Powered by
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">
        Neroitech Inventions
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>
  </div>

  <script>
    const ipEl = document.getElementById("ip");
    const detailsEl = document.getElementById("details");
    const statusEl = document.getElementById("status");
    const refreshBtn = document.getElementById("refresh");
    const copyBtn = document.getElementById("copyBtn");

    let currentIP = "";

    async function detectIP() {
      ipEl.textContent = "Detecting…";
      detailsEl.classList.remove("show");
      statusEl.textContent = "";
      statusEl.className = "status";
      currentIP = "";
      copyBtn.textContent = "Copy IP";
      copyBtn.classList.remove("copied");

      try {
        // Primary: ipify for reliable IP
        const ipRes = await fetch("https://api.ipify.org?format=json");
        if (!ipRes.ok) throw new Error("IP service failed");
        const ipData = await ipRes.json();
        const ip = ipData.ip;
        currentIP = ip;
        ipEl.textContent = ip;

        // Secondary: more details (may be rate-limited)
        try {
          const detailRes = await fetch(`https://ipapi.co/${ip}/json/`);
          if (detailRes.ok) {
            const d = await detailRes.json();
            if (!d.error) {
              document.getElementById("city").textContent = d.city || "—";
              document.getElementById("region").textContent = d.region || "—";
              document.getElementById("country").textContent = d.country_name || "—";
              document.getElementById("org").textContent = d.org || "—";
              document.getElementById("timezone").textContent = d.timezone || "—";
              detailsEl.classList.add("show");
            }
          }
        } catch (_) {
          // Details are optional
        }

        statusEl.textContent = "Updated just now";
      } catch (err) {
        ipEl.textContent = "Unable to detect";
        statusEl.textContent = "Check your connection and try again";
        statusEl.className = "status error";
      }
    }

    function copyIP() {
      if (!currentIP) return;
      navigator.clipboard.writeText(currentIP).then(() => {
        copyBtn.textContent = "Copied!";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "Copy IP";
          copyBtn.classList.remove("copied");
        }, 1800);
      }).catch(() => {
        statusEl.textContent = "Could not copy";
        statusEl.className = "status error";
      });
    }

    refreshBtn.addEventListener("click", detectIP);
    copyBtn.addEventListener("click", copyIP);
    detectIP();
  </script>
</body>
</html>
