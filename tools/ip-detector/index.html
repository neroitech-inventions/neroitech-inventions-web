<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My IP Address</title>

     <!-- Google Analytics -->
     <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM106YDX6N"></script>
     <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-QM106YDX6N');
     </script>

     <!-- Favicon -->
     <link href="images/favicon.ico" rel="icon">
<style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .ip-display {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 16px 0;
      word-break: break-all;
    }
    .details {
      margin-top: 24px;
      text-align: left;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .details p {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
    }
    .details p:last-child { border-bottom: none; }
    .details span:first-child { color: var(--muted); }
    button {
      margin-top: 28px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .error { color: #f87171; }
  .powered {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    letter-spacing: 0.4px;
  }
  .powered a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    position: relative;
    transition: color 0.2s;
  }
  .powered a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #58a6ff, #79b8ff);
    transition: width 0.3s ease;
  }
  .powered a:hover {
    color: #79b8ff;
  }
  .powered a:hover::after {
    width: 100%;
  }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your IP Address</h1>
    <p class="subtitle">Detects your public IP and basic location info</p>
    <div class="ip-display" id="ip">Detecting...</div>
    <div class="details" id="details" style="display:none;">
      <p><span>City</span> <span id="city">—</span></p>
      <p><span>Region</span> <span id="region">—</span></p>
      <p><span>Country</span> <span id="country">—</span></p>
      <p><span>ISP / Org</span> <span id="org">—</span></p>
      <p><span>Timezone</span> <span id="timezone">—</span></p>
    </div>
    <button id="refresh">Refresh</button>
    <div class="status" id="status"></div>
    <div class="powered">Powered by <a href="https://niti.com.ng/" target="_blank" rel="noopener">
        Neroitech Inventions
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a></div>
  </div>

  <script>
    const ipEl = document.getElementById("ip");
    const detailsEl = document.getElementById("details");
    const statusEl = document.getElementById("status");
    const refreshBtn = document.getElementById("refresh");

    async function detectIP() {
      ipEl.textContent = "Detecting...";
      detailsEl.style.display = "none";
      statusEl.textContent = "";
      statusEl.className = "status";

      try {
        // Primary: ipify for reliable IP
        const ipRes = await fetch("https://api.ipify.org?format=json");
        if (!ipRes.ok) throw new Error("IP service failed");
        const ipData = await ipRes.json();
        const ip = ipData.ip;
        ipEl.textContent = ip;

        // Secondary: more details (may be rate-limited)
        try {
          const detailRes = await fetch(`https://ipapi.co/${ip}/json/`);
          if (detailRes.ok) {
            const d = await detailRes.json();
            if (!d.error) {
              document.getElementById("city").textContent = d.city || "—";
              document.getElementById("region").textContent = d.region || "—";
              document.getElementById("country").textContent = d.country_name || "—";
              document.getElementById("org").textContent = d.org || "—";
              document.getElementById("timezone").textContent = d.timezone || "—";
              detailsEl.style.display = "block";
            }
          }
        } catch (_) {
          // Details are optional
        }

        statusEl.textContent = "Updated just now";
      } catch (err) {
        ipEl.textContent = "Unable to detect";
        statusEl.textContent = "Check your connection and try again";
        statusEl.className = "status error";
      }
    }

    refreshBtn.addEventListener("click", detectIP);
    detectIP();
  </script>
</body>
</html>
