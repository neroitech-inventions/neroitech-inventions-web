<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM106YDX6N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QM106YDX6N');
  </script>

  <link href="images/favicon.ico" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #07070f;
    --surface: rgba(18, 18, 32, 0.72);
    --surface-solid: #12121f;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --accent: #7c6cff;
    --accent-soft: rgba(124, 108, 255, 0.15);
    --accent-glow: rgba(124, 108, 255, 0.35);
    --text: #f4f4f8;
    --muted: #9494b0;
    --success: #3dd68c;
    --danger: #ff6b7a;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 108, 255, 0.22), transparent 55%),
      radial-gradient(ellipse 50% 40% at 90% 80%, rgba(99, 102, 241, 0.08), transparent);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 2.25rem 1.75rem 2rem;
    box-shadow: var(--shadow);
    text-align: center;
  }

  h1 {
    font-size: clamp(1.65rem, 5vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #c4b5fd 0%, #fff 50%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .description {
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.55;
    margin-bottom: 1.75rem;
    max-width: 36ch;
    margin-left: auto;
    margin-right: auto;
  }

  /* Timer units */
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem;
    margin: 0.5rem 0 1.5rem;
  }

  @media (max-width: 420px) {
    .timer { gap: 0.4rem; }
  }

  .unit {
    background: var(--accent-soft);
    border: 1px solid rgba(124, 108, 255, 0.28);
    border-radius: 16px;
    padding: 1rem 0.4rem 0.85rem;
    position: relative;
    overflow: hidden;
  }

  .unit::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%);
    pointer-events: none;
  }

  .unit .value {
    font-size: clamp(1.75rem, 7vw, 2.6rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .unit .label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-top: 0.45rem;
    opacity: 0.9;
  }

  .finished {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--success);
    margin: 1.75rem 0 1rem;
    letter-spacing: -0.02em;
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.04); opacity: 0.9; }
  }

  .target-info {
    color: var(--muted);
    font-size: 0.88rem;
    margin-top: 0.25rem;
    margin-bottom: 0.5rem;
  }

  /* Creator form */
  .creator {
    text-align: left;
  }

  .creator h2 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
  }

  .creator .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 1.75rem;
    line-height: 1.45;
  }

  label {
    display: block;
    margin: 1.1rem 0 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, textarea {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-solid);
    color: var(--text);
    font-size: 0.98rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  textarea {
    min-height: 84px;
    resize: vertical;
    line-height: 1.45;
  }

  /* Mode toggle */
  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin: 1.15rem 0 0.25rem;
    background: var(--surface-solid);
    padding: 4px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }

  .mode-toggle label {
    text-align: center;
    padding: 0.7rem 0.5rem;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    margin: 0;
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    color: var(--muted);
    transition: all 0.18s;
  }

  .mode-toggle input { display: none; }

  .mode-toggle input:checked + label {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  button, .btn {
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.95rem 1.25rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #7c6cff, #6366f1);
    color: white;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  button:hover, .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.06);
  }

  button:active, .btn:active {
    transform: translateY(0);
  }

  .share-url {
    margin-top: 1.35rem;
    background: var(--surface-solid);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    word-break: break-all;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.8rem;
    color: #c4b5fd;
    border: 1px dashed rgba(124, 108, 255, 0.35);
    line-height: 1.5;
    text-align: left;
  }

  .copy-btn {
    margin-top: 0.65rem;
    padding: 0.55rem 1.1rem;
    width: auto;
    font-size: 0.88rem;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: none;
    border: 1px solid var(--border-strong);
  }

  .copy-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    filter: none;
  }

  .open-link {
    display: inline-block;
    margin-top: 1rem;
    color: #c4b5fd;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
  }

  .open-link:hover { text-decoration: underline; }

  .create-new {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1.5rem;
    padding: 0.65rem 1.35rem;
    background: transparent;
    border: 1px solid rgba(124, 108, 255, 0.45);
    color: #c4b5fd;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    transition: all 0.2s;
  }

  .create-new:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .powered {
    margin-top: 1.75rem;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .powered a {
    color: #a5b4fc;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
  }

  .powered a:hover { color: #c7d2fe; }

  .footer {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: #5a5a72;
  }

  .field-group {
    margin-top: 0.25rem;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Content injected by JS -->
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get('name') || params.get('title') || 'Countdown Timer';
const description = params.get('description') || params.get('desc') || '';
const endParam = params.get('end') || params.get('date');
const secondsParam = params.get('seconds') || params.get('duration');
const minutesParam = params.get('minutes');

document.title = name;

function pad(n) { return String(n).padStart(2, '0'); }

function formatTarget(date) {
  return date.toLocaleString(undefined, {
    weekday: 'short',
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTimer(targetDate, isDuration = false) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>${escapeHtml(name)}</h1>
    ${description ? `<p class="description">${escapeHtml(description)}</p>` : ''}
    <div class="timer" id="timer">
      <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>
    <div id="finished" class="finished" style="display:none;">Time's up!</div>
    <div class="target-info" id="target-info"></div>
    <a href="${window.location.pathname}" class="create-new">+ Create new timer</a>
    <div class="powered">
      Powered by
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">Neroitech Inventions</a>
    </div>
  `;

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const finishedEl = document.getElementById('finished');
  const timerEl = document.getElementById('timer');
  const targetInfo = document.getElementById('target-info');

  if (isDuration) {
    targetInfo.textContent = 'Duration timer · started on page load';
  } else {
    targetInfo.textContent = `Ends ${formatTarget(targetDate)}`;
  }

  function update() {
    const now = new Date();
    let diff = targetDate - now;

    if (diff <= 0) {
      daysEl.textContent = '00';
      hoursEl.textContent = '00';
      minutesEl.textContent = '00';
      secondsEl.textContent = '00';
      timerEl.style.display = 'none';
      finishedEl.style.display = 'block';
      clearInterval(interval);
      return;
    }

    const days = Math.floor(diff / 86400000);
    diff %= 86400000;
    const hours = Math.floor(diff / 3600000);
    diff %= 3600000;
    const minutes = Math.floor(diff / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);

    const dayUnit = daysEl.parentElement;
    dayUnit.style.display = days > 0 ? 'block' : 'none';
  }

  update();
  const interval = setInterval(update, 1000);
}

function showCreator() {
  const app = document.getElementById('app');
  const now = new Date();
  const defaultEnd = new Date(now.getTime() + 24 * 60 * 60 * 1000);
  const isoLocal = defaultEnd.toISOString().slice(0, 16);

  app.innerHTML = `
    <div class="creator">
      <h2>Create countdown</h2>
      <p class="sub">Set a name and end time (or duration). You’ll get a shareable link.</p>

      <label for="c-name">Timer name</label>
      <input type="text" id="c-name" placeholder="e.g. Product Launch" value="My Timer" autocomplete="off">

      <label for="c-desc">Description (optional)</label>
      <textarea id="c-desc" placeholder="What is this countdown for?"></textarea>

      <div class="mode-toggle">
        <input type="radio" name="mode" id="mode-end" checked>
        <label for="mode-end">End date & time</label>
        <input type="radio" name="mode" id="mode-duration">
        <label for="mode-duration">Duration from now</label>
      </div>

      <div id="end-fields" class="field-group">
        <label for="c-end">End date & time (your local time)</label>
        <input type="datetime-local" id="c-end" value="${isoLocal}">
      </div>

      <div id="duration-fields" class="field-group" style="display:none;">
        <label for="c-seconds">Duration in seconds</label>
        <input type="number" id="c-seconds" min="1" value="300" placeholder="300">
        <label for="c-minutes">Or minutes</label>
        <input type="number" id="c-minutes" min="0" value="5" placeholder="5">
      </div>

      <button type="button" onclick="generateUrl()">Generate shareable URL</button>
      <div id="result"></div>
    </div>
    <div class="powered">
      Powered by
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">Neroitech Inventions</a>
    </div>
    <div class="footer">Open the generated URL to start the countdown</div>
  `;

  document.getElementById('mode-end').addEventListener('change', toggleMode);
  document.getElementById('mode-duration').addEventListener('change', toggleMode);
}

function toggleMode() {
  const isEnd = document.getElementById('mode-end').checked;
  document.getElementById('end-fields').style.display = isEnd ? 'block' : 'none';
  document.getElementById('duration-fields').style.display = isEnd ? 'none' : 'block';
}

function generateUrl() {
  const cName = document.getElementById('c-name').value.trim() || 'Countdown';
  const cDesc = document.getElementById('c-desc').value.trim();
  const isEnd = document.getElementById('mode-end').checked;

  const url = new URL(window.location.href.split('?')[0]);
  url.searchParams.set('name', cName);
  if (cDesc) url.searchParams.set('description', cDesc);

  if (isEnd) {
    const endVal = document.getElementById('c-end').value;
    if (!endVal) { alert('Please pick an end date/time'); return; }
    url.searchParams.set('end', endVal);
  } else {
    let secs = parseInt(document.getElementById('c-seconds').value, 10);
    const mins = parseInt(document.getElementById('c-minutes').value, 10) || 0;
    if (mins > 0 && !secs) secs = mins * 60;
    if (!secs || secs < 1) { alert('Please enter a positive duration'); return; }
    url.searchParams.set('seconds', secs);
  }

  const finalUrl = url.toString();
  document.getElementById('result').innerHTML = `
    <div class="share-url">${escapeHtml(finalUrl)}</div>
    <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText('${finalUrl.replace(/'/g, "\\'")}').then(() => this.textContent = 'Copied!')">Copy URL</button>
    <p style="text-align:center;"><a class="open-link" href="${finalUrl}">Open timer →</a></p>
  `;
}

function init() {
  let target = null;
  let isDuration = false;

  if (endParam) {
    target = new Date(endParam);
    if (isNaN(target.getTime())) {
      target = new Date(endParam.replace(' ', 'T'));
    }
  } else if (secondsParam) {
    const secs = parseInt(secondsParam, 10);
    if (secs > 0) {
      target = new Date(Date.now() + secs * 1000);
      isDuration = true;
    }
  } else if (minutesParam) {
    const mins = parseInt(minutesParam, 10);
    if (mins > 0) {
      target = new Date(Date.now() + mins * 60 * 1000);
      isDuration = true;
    }
  }

  if (target && !isNaN(target.getTime())) {
    renderTimer(target, isDuration);
  } else {
    showCreator();
  }
}

init();
</script>
</body>
</html>
