<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>

     <!-- Google Analytics -->
     <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM106YDX6N"></script>
     <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-QM106YDX6N');
     </script>

     <!-- Favicon -->
     <link href="images/favicon.ico" rel="icon">
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --text: #f8f9fa;
    --muted: #a0a0b8;
    --danger: #ff6b6b;
    --success: #51cf66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .container {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, var(--accent2), #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .description {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 2rem;
    line-height: 1.5;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin: 1.5rem 0 2rem;
  }
  .unit {
    background: rgba(108, 92, 231, 0.15);
    border: 1px solid rgba(108, 92, 231, 0.3);
    border-radius: 16px;
    padding: 1rem 0.8rem;
    min-width: 80px;
  }
  .unit .value {
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
  }
  .unit .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent2);
    margin-top: 0.4rem;
  }
  .finished {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--success);
    margin: 2rem 0;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .target-info {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 1rem;
  }
  /* Creator form */
  .creator {
    text-align: left;
    margin-top: 1rem;
  }
  .creator h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    font-size: 1.6rem;
  }
  label {
    display: block;
    margin: 1rem 0 0.4rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  input, textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 12px;
    border: 1px solid #333;
    background: #12121f;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { min-height: 80px; resize: vertical; }
  .mode-toggle {
    display: flex;
    gap: 1rem;
    margin: 1rem 0;
  }
  .mode-toggle label {
    flex: 1;
    text-align: center;
    padding: 0.6rem;
    border-radius: 10px;
    border: 1px solid #333;
    cursor: pointer;
    margin: 0;
  }
  .mode-toggle input { display: none; }
  .mode-toggle input:checked + label {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button {
    width: 100%;
    margin-top: 1.5rem;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--accent), #8b7cf7);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  .share-url {
    margin-top: 1.5rem;
    background: #12121f;
    border-radius: 12px;
    padding: 1rem;
    word-break: break-all;
    font-family: monospace;
    font-size: 0.85rem;
    color: var(--accent2);
    border: 1px dashed #444;
  }
  .copy-btn {
    margin-top: 0.5rem;
    padding: 0.5rem 1rem;
    width: auto;
    font-size: 0.9rem;
    background: #333;
  }
  .footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #555;
  }
  .powered {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    letter-spacing: 0.4px;
  }
  .powered a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    position: relative;
    transition: color 0.2s;
  }
  .powered a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #58a6ff, #79b8ff);
    transition: width 0.3s ease;
  }
  .powered a:hover {
    color: #79b8ff;
  }
  .powered a:hover::after {
    width: 100%;
  }
  .create-new {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.6rem 1.4rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent2);
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .create-new:hover {
    background: var(--accent);
    color: white;
  }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Content injected by JS -->
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get('name') || params.get('title') || 'Countdown Timer';
const description = params.get('description') || params.get('desc') || '';
const endParam = params.get('end') || params.get('date');
const secondsParam = params.get('seconds') || params.get('duration');
const minutesParam = params.get('minutes');

document.title = name;

function pad(n) { return String(n).padStart(2, '0'); }

function formatTarget(date) {
  return date.toLocaleString(undefined, {
    weekday: 'short',
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function renderTimer(targetDate, isDuration = false) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>${escapeHtml(name)}</h1>
    ${description ? `<p class="description">${escapeHtml(description)}</p>` : ''}
    <div class="timer" id="timer">
      <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>
    <div id="finished" class="finished" style="display:none;">Time's up!</div>
    <div class="target-info" id="target-info"></div>
    <a href="${window.location.pathname}" class="create-new">+ Create new timer</a>
    <div class="powered">
      <span>Powered by</span>
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">
        Neroitech Inventions
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>
    <div class="footer"></div>
  `;

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const finishedEl = document.getElementById('finished');
  const timerEl = document.getElementById('timer');
  const targetInfo = document.getElementById('target-info');

  if (isDuration) {
    targetInfo.textContent = `Duration timer • Started on page load`;
  } else {
    targetInfo.textContent = `Counting down to ${formatTarget(targetDate)}`;
  }

  function update() {
    const now = new Date();
    let diff = targetDate - now;

    if (diff <= 0) {
      daysEl.textContent = '00';
      hoursEl.textContent = '00';
      minutesEl.textContent = '00';
      secondsEl.textContent = '00';
      timerEl.style.display = 'none';
      finishedEl.style.display = 'block';
      clearInterval(interval);
      return;
    }

    const days = Math.floor(diff / 86400000);
    diff %= 86400000;
    const hours = Math.floor(diff / 3600000);
    diff %= 3600000;
    const minutes = Math.floor(diff / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);

    // Hide days unit if 0 and not many days
    const dayUnit = daysEl.parentElement;
    dayUnit.style.display = days > 0 ? 'block' : 'none';
  }

  update();
  const interval = setInterval(update, 1000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showCreator() {
  const app = document.getElementById('app');
  const now = new Date();
  const defaultEnd = new Date(now.getTime() + 24 * 60 * 60 * 1000); // tomorrow
  const isoLocal = defaultEnd.toISOString().slice(0, 16); // datetime-local format

  app.innerHTML = `
    <div class="creator">
      <h2>Create Countdown Timer</h2>
      <p style="color:var(--muted); text-align:center; margin-bottom:1.5rem;">
        Fill the form to generate a shareable URL. All data lives in the link — no server needed.
      </p>

      <label>Timer Name</label>
      <input type="text" id="c-name" placeholder="e.g. Product Launch" value="My Timer">

      <label>Description (optional)</label>
      <textarea id="c-desc" placeholder="What is this countdown for?"></textarea>

      <div class="mode-toggle">
        <input type="radio" name="mode" id="mode-end" checked>
        <label for="mode-end">End Date & Time</label>
        <input type="radio" name="mode" id="mode-duration">
        <label for="mode-duration">Duration from now</label>
      </div>

      <div id="end-fields">
        <label>End Date & Time (your local timezone)</label>
        <input type="datetime-local" id="c-end" value="${isoLocal}">
      </div>

      <div id="duration-fields" style="display:none;">
        <label>Duration in seconds</label>
        <input type="number" id="c-seconds" min="1" value="300" placeholder="300">
        <label>Or minutes</label>
        <input type="number" id="c-minutes" min="0" value="5" placeholder="5">
      </div>

      <button onclick="generateUrl()">Generate Shareable URL</button>
      <div id="result"></div>
    </div>
    <div class="powered">
      <span>Powered by</span>
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">
        Neroitech Inventions
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>
    <div class="footer">Open the generated URL to start the countdown</div>
  `;

  document.getElementById('mode-end').addEventListener('change', toggleMode);
  document.getElementById('mode-duration').addEventListener('change', toggleMode);
}

function toggleMode() {
  const isEnd = document.getElementById('mode-end').checked;
  document.getElementById('end-fields').style.display = isEnd ? 'block' : 'none';
  document.getElementById('duration-fields').style.display = isEnd ? 'none' : 'block';
}

function generateUrl() {
  const cName = document.getElementById('c-name').value.trim() || 'Countdown';
  const cDesc = document.getElementById('c-desc').value.trim();
  const isEnd = document.getElementById('mode-end').checked;

  const url = new URL(window.location.href.split('?')[0]);
  url.searchParams.set('name', cName);
  if (cDesc) url.searchParams.set('description', cDesc);

  if (isEnd) {
    const endVal = document.getElementById('c-end').value;
    if (!endVal) { alert('Please pick an end date/time'); return; }
    // datetime-local is local; convert to ISO with timezone offset or just pass as-is (browser parses local)
    url.searchParams.set('end', endVal);
  } else {
    let secs = parseInt(document.getElementById('c-seconds').value, 10);
    const mins = parseInt(document.getElementById('c-minutes').value, 10) || 0;
    if (mins > 0 && !secs) secs = mins * 60;
    if (!secs || secs < 1) { alert('Please enter a positive duration'); return; }
    url.searchParams.set('seconds', secs);
  }

  const finalUrl = url.toString();
  document.getElementById('result').innerHTML = `
    <div class="share-url">${escapeHtml(finalUrl)}</div>
    <button class="copy-btn" onclick="navigator.clipboard.writeText('${finalUrl.replace(/'/g, "\\'")}').then(() => alert('Copied!'))">Copy URL</button>
    <p style="margin-top:1rem; text-align:center;"><a href="${finalUrl}" style="color:var(--accent2);">Open timer →</a></p>
  `;
}

// Main logic
function init() {
  let target = null;
  let isDuration = false;

  if (endParam) {
    // Support both datetime-local style (no Z) and full ISO
    target = new Date(endParam);
    if (isNaN(target.getTime())) {
      // Try appending local interpretation
      target = new Date(endParam.replace(' ', 'T'));
    }
  } else if (secondsParam) {
    const secs = parseInt(secondsParam, 10);
    if (secs > 0) {
      target = new Date(Date.now() + secs * 1000);
      isDuration = true;
    }
  } else if (minutesParam) {
    const mins = parseInt(minutesParam, 10);
    if (mins > 0) {
      target = new Date(Date.now() + mins * 60 * 1000);
      isDuration = true;
    }
  }

  if (target && !isNaN(target.getTime())) {
    renderTimer(target, isDuration);
  } else {
    showCreator();
  }
}

init();
</script>
</body>
</html>
