    <title>QR Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --success-color: #16a34a;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        textarea, input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-white);
            color: var(--text-primary);
        }

        textarea:focus, input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .color-input-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .color-input-group input[type="color"] {
            width: 50px;
            height: 45px;
            padding: 3px;
            cursor: pointer;
            border-radius: var(--radius);
        }

        .color-input-group input[type="text"] {
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .qr-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            background: var(--bg-light);
            border-radius: var(--radius);
            border: 2px dashed var(--border-color);
        }

        #qrcode {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 250px;
            min-height: 250px;
        }

        #qrcode svg {
            max-width: 100%;
            height: auto;
        }

        .qr-info {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 15px;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .alert {
            padding: 15px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success-color);
        }

        .alert-error {
            background: #fee2e2;
            color: #7f1d1d;
            border-left: 4px solid var(--danger-color);
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 1.2em;
            height: 1.2em;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            #qrcode {
                min-width: 200px;
                min-height: 200px;
            }
        }

        .hidden {
            display: none;
        }

        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            z-index: 1000;
        }

        #backToTop:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        #backToTop:active {
            transform: translateY(-2px);
        }

        #backToTop.show {
            display: flex;
        }

        .footer {
            background: var(--bg-light);
            border-top: 1px solid var(--border-color);
            padding: 30px 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            transition: var(--transition);
            font-weight: 500;
        }

        .footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            #backToTop {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR Code Generator</h1>
            <p>Create, customize and download QR codes instantly</p>
        </div>

        <div class="content">
            <div id="alert" class="alert"></div>

            <form id="qrForm">
                <div class="form-group">
                    <label for="text">Text or URL</label>
                    <textarea id="text" placeholder="Enter text, URL, email, phone number, or any data you want to encode..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="size">QR Code Size (px)</label>
                        <input type="number" id="size" min="150" max="500" step="50" value="300">
                    </div>

                    <div class="form-group">
                        <label for="errorLevel">Error Correction Level</label>
                        <select id="errorLevel">
                            <option value="L">L - 7% recovery</option>
                            <option value="M" selected>M - 15% recovery</option>
                            <option value="Q">Q - 25% recovery</option>
                            <option value="H">H - 30% recovery</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Dark Color</label>
                        <div class="color-input-group">
                            <input type="color" id="colorDark" value="#000000">
                            <input type="text" id="colorDarkText" value="#000000" readonly>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Light Color</label>
                        <div class="color-input-group">
                            <input type="color" id="colorLight" value="#ffffff">
                            <input type="text" id="colorLightText" value="#ffffff" readonly>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-primary" onclick="generateQR()">
                        <span>✨</span> Generate QR Code
                    </button>
                    <button type="reset" class="btn-secondary" onclick="resetForm()">
                        <span>↺</span> Reset
                    </button>
                </div>
            </form>

            <div class="qr-preview">
                <p style="color: var(--text-secondary); margin-bottom: 20px;">Your QR Code will appear here</p>
                <div id="qrcode"></div>
                <div class="qr-info">
                    <p id="qrInfo">Enter text or URL above and click "Generate QR Code"</p>
                </div>

                <div class="preview-actions" id="previewActions" style="display: none;">
                    <button type="button" class="btn-success" onclick="downloadQR()">
                        <span>⬇️</span> Download PNG
                    </button>
                    <button type="button" class="btn-secondary" onclick="copySVG()">
                        <span>📋</span> Copy SVG
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2016–2026 <a href="https://niti.com.ng/" target="_blank" rel="noopener noreferrer">Neroitech Inventions</a>. All rights reserved.</p>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="backToTop" onclick="scrollToTop()" title="Back to top">

    </button>

    <script>
        // QRCode Library (Full version)
        var QRCode;

        (function () {
            function QR8bitByte(data) {
                this.mode = QRMode.MODE_8BIT_BYTE;
                this.data = data;
                this.parsedData = [];

                for (var i = 0, l = this.data.length; i < l; i++) {
                    var byteArray = [];
                    var code = this.data.charCodeAt(i);

                    if (code > 0x10000) {
                        byteArray[0] = 0xF0 | ((code & 0x1C0000) >>> 18);
                        byteArray[1] = 0x80 | ((code & 0x3F000) >>> 12);
                        byteArray[2] = 0x80 | ((code & 0xFC0) >>> 6);
                        byteArray[3] = 0x80 | (code & 0x3F);
                    } else if (code > 0x800) {
                        byteArray[0] = 0xE0 | ((code & 0xF000) >>> 12);
                        byteArray[1] = 0x80 | ((code & 0xFC0) >>> 6);
                        byteArray[2] = 0x80 | (code & 0x3F);
                    } else if (code > 0x80) {
                        byteArray[0] = 0xC0 | ((code & 0x7C0) >>> 6);
                        byteArray[1] = 0x80 | (code & 0x3F);
                    } else {
                        byteArray[0] = code;
                    }

                    this.parsedData.push(byteArray);
                }

                this.parsedData = Array.prototype.concat.apply([], this.parsedData);

                if (this.parsedData.length != this.data.length) {
                    this.parsedData.unshift(191);
                    this.parsedData.unshift(187);
                    this.parsedData.unshift(239);
                }
            }

            QR8bitByte.prototype = {
                getLength: function (buffer) {
                    return this.parsedData.length;
                },
                write: function (buffer) {
                    for (var i = 0, l = this.parsedData.length; i < l; i++) {
                        buffer.put(this.parsedData[i], 8);
                    }
                }
            };

            function QRCodeModel(typeNumber, errorCorrectLevel) {
                this.typeNumber = typeNumber;
                this.errorCorrectLevel = errorCorrectLevel;
                this.modules = null;
                this.moduleCount = 0;
                this.dataCache = null;
                this.dataList = [];
            }

            QRCodeModel.prototype = {
                addData: function (data) {
                    var newData = new QR8bitByte(data);
                    this.dataList.push(newData);
                    this.dataCache = null;
                },
                isDark: function (row, col) {
                    if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
                        throw new Error(row + "," + col);
                    }
                    return this.modules[row][col];
                },
                getModuleCount: function () {
                    return this.moduleCount;
                },
                make: function () {
                    this.makeImpl(false, this.getBestMaskPattern());
                },
                makeImpl: function (test, maskPattern) {
                    this.moduleCount = this.typeNumber * 4 + 17;
                    this.modules = new Array(this.moduleCount);
                    for (var row = 0; row < this.moduleCount; row++) {
                        this.modules[row] = new Array(this.moduleCount);
                        for (var col = 0; col < this.moduleCount; col++) {
                            this.modules[row][col] = null;
                        }
                    }
                    this.setupPositionProbePattern(0, 0);
                    this.setupPositionProbePattern(this.moduleCount - 7, 0);
                    this.setupPositionProbePattern(0, this.moduleCount - 7);
                    this.setupPositionAdjustPattern();
                    this.setupTimingPattern();
                    this.setupTypeInfo(test, maskPattern);
                    if (this.typeNumber >= 7) {
                        this.setupTypeNumber(test);
                    }
                    if (this.dataCache == null) {
                        this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
                    }
                    this.mapData(this.dataCache, maskPattern);
                },
                setupPositionProbePattern: function (row, col) {
                    for (var r = -1; r <= 7; r++) {
                        if (row + r <= -1 || this.moduleCount <= row + r) continue;
                        for (var c = -1; c <= 7; c++) {
                            if (col + c <= -1 || this.moduleCount <= col + c) continue;
                            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                                this.modules[row + r][col + c] = true;
                            } else {
                                this.modules[row + r][col + c] = false;
                            }
                        }
                    }
                },
                getBestMaskPattern: function () {
                    var minLostPoint = 0;
                    var pattern = 0;
                    for (var i = 0; i < 8; i++) {
                        this.makeImpl(true, i);
                        var lostPoint = QRUtil.getLostPoint(this);
                        if (i == 0 || minLostPoint > lostPoint) {
                            minLostPoint = lostPoint;
                            pattern = i;
                        }
                    }
                    return pattern;
                },
                setupTimingPattern: function () {
                    for (var r = 8; r < this.moduleCount - 8; r++) {
                        if (this.modules[r][6] != null) {
                            continue;
                        }
                        this.modules[r][6] = (r % 2 == 0);
                    }
                    for (var c = 8; c < this.moduleCount - 8; c++) {
                        if (this.modules[6][c] != null) {
                            continue;
                        }
                        this.modules[6][c] = (c % 2 == 0);
                    }
                },
                setupPositionAdjustPattern: function () {
                    var pos = QRUtil.getPatternPosition(this.typeNumber);
                    for (var i = 0; i < pos.length; i++) {
                        for (var j = 0; j < pos.length; j++) {
                            var row = pos[i];
                            var col = pos[j];
                            if (this.modules[row][col] != null) {
                                continue;
                            }
                            for (var r = -2; r <= 2; r++) {
                                for (var c = -2; c <= 2; c++) {
                                    if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                                        this.modules[row + r][col + c] = true;
                                    } else {
                                        this.modules[row + r][col + c] = false;
                                    }
                                }
                            }
                        }
                    }
                },
                setupTypeNumber: function (test) {
                    var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
                    for (var i = 0; i < 18; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
                    }
                    for (var i = 0; i < 18; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
                    }
                },
                setupTypeInfo: function (test, maskPattern) {
                    var data = (this.errorCorrectLevel << 3) | maskPattern;
                    var bits = QRUtil.getBCHTypeInfo(data);
                    for (var i = 0; i < 15; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        if (i < 6) {
                            this.modules[i][8] = mod;
                        } else if (i < 8) {
                            this.modules[i + 1][8] = mod;
                        } else {
                            this.modules[this.moduleCount - 15 + i][8] = mod;
                        }
                    }
                    for (var i = 0; i < 15; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        if (i < 8) {
                            this.modules[8][this.moduleCount - i - 1] = mod;
                        } else if (i < 9) {
                            this.modules[8][15 - i - 1 + 1] = mod;
                        } else {
                            this.modules[8][15 - i - 1] = mod;
                        }
                    }
                    this.modules[this.moduleCount - 8][8] = (!test);
                },
                mapData: function (data, maskPattern) {
                    var inc = -1;
                    var row = this.moduleCount - 1;
                    var bitIndex = 7;
                    var byteIndex = 0;
                    for (var col = this.moduleCount - 1; col > 0; col -= 2) {
                        if (col == 6) col--;
                        while (true) {
                            for (var c = 0; c < 2; c++) {
                                if (this.modules[row][col - c] == null) {
                                    var dark = false;
                                    if (byteIndex < data.length) {
                                        dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                                    }
                                    var mask = QRUtil.getMask(maskPattern, row, col - c);
                                    if (mask) {
                                        dark = !dark;
                                    }
                                    this.modules[row][col - c] = dark;
                                    bitIndex--;
                                    if (bitIndex == -1) {
                                        byteIndex++;
                                        bitIndex = 7;
                                    }
                                }
                            }
                            row += inc;
                            if (row < 0 || this.moduleCount <= row) {
                                row -= inc;
                                inc = -inc;
                                break;
                            }
                        }
                    }
                }
            };

            QRCodeModel.PAD0 = 0xEC;
            QRCodeModel.PAD1 = 0x11;

            QRCodeModel.createData = function (typeNumber, errorCorrectLevel, dataList) {
                var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
                var buffer = new QRBitBuffer();
                for (var i = 0; i < dataList.length; i++) {
                    var data = dataList[i];
                    buffer.put(data.mode, 4);
                    buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                    data.write(buffer);
                }
                var totalDataCount = 0;
                for (var i = 0; i < rsBlocks.length; i++) {
                    totalDataCount += rsBlocks[i].dataCount;
                }
                if (buffer.getLengthInBits() > totalDataCount * 8) {
                    throw new Error("code length overflow. (" + buffer.getLengthInBits() + ">" + totalDataCount * 8 + ")");
                }
                if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
                    buffer.put(0, 4);
                }
                while (buffer.getLengthInBits() % 8 != 0) {
                    buffer.putBit(false);
                }
                while (true) {
                    if (buffer.getLengthInBits() >= totalDataCount * 8) {
                        break;
                    }
                    buffer.put(QRCodeModel.PAD0, 8);
                    if (buffer.getLengthInBits() >= totalDataCount * 8) {
                        break;
                    }
                    buffer.put(QRCodeModel.PAD1, 8);
                }
                return QRCodeModel.createBytes(buffer, rsBlocks);
            };

            QRCodeModel.createBytes = function (buffer, rsBlocks) {
                var offset = 0;
                var maxDcCount = 0;
                var maxEcCount = 0;
                var dcdata = new Array(rsBlocks.length);
                var ecdata = new Array(rsBlocks.length);
                for (var r = 0; r < rsBlocks.length; r++) {
                    var dcCount = rsBlocks[r].dataCount;
                    var ecCount = rsBlocks[r].totalCount - dcCount;
                    maxDcCount = Math.max(maxDcCount, dcCount);
                    maxEcCount = Math.max(maxEcCount, ecCount);
                    dcdata[r] = new Array(dcCount);
                    for (var i = 0; i < dcdata[r].length; i++) {
                        dcdata[r][i] = 0xff & buffer.buffer[i + offset];
                    }
                    offset += dcCount;
                    var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
                    var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
                    var modPoly = rawPoly.mod(rsPoly);
                    ecdata[r] = new Array(rsPoly.getLength() - 1);
                    for (var i = 0; i < ecdata[r].length; i++) {
                        var modIndex = i + modPoly.getLength() - ecdata[r].length;
                        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
                    }
                }
                var totalCodeCount = 0;
                for (var i = 0; i < rsBlocks.length; i++) {
                    totalCodeCount += rsBlocks[i].totalCount;
                }
                var data = new Array(totalCodeCount);
                var index = 0;
                for (var i = 0; i < maxDcCount; i++) {
                    for (var r = 0; r < rsBlocks.length; r++) {
                        if (i < dcdata[r].length) {
                            data[index++] = dcdata[r][i];
                        }
                    }
                }
                for (var i = 0; i < maxEcCount; i++) {
                    for (var r = 0; r < rsBlocks.length; r++) {
                        if (i < ecdata[r].length) {
                            data[index++] = ecdata[r][i];
                        }
                    }
                }
                return data;
            };

            var QRMode = {

                this._el.title = sText;
                this._oDrawing.draw(this._oQRCode);
            };

            QRCode.prototype.clear = function () {
                this._oDrawing.clear();
            };

            QRCode.CorrectLevel = QRErrorCorrectLevel;
        })();

        // Modern Application Code
        let qrCode = null;
        let currentText = '';

        // Initialize color sync
        document.getElementById('colorDark').addEventListener('change', function () {
            document.getElementById('colorDarkText').value = this.value;
        });

        document.getElementById('colorDarkText').addEventListener('change', function () {
            if (this.value.match(/^#[0-9A-F]{6}$/i)) {
                document.getElementById('colorDark').value = this.value;
            }
        });

        document.getElementById('colorLight').addEventListener('change', function () {
            document.getElementById('colorLightText').value = this.value;
        });

        document.getElementById('colorLightText').addEventListener('change', function () {
            if (this.value.match(/^#[0-9A-F]{6}$/i)) {
                document.getElementById('colorLight').value = this.value;
            }
        });

        function showAlert(message, type = 'success') {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3000);
        }

        function generateQR() {
            const text = document.getElementById('text').value.trim();
            const size = parseInt(document.getElementById('size').value);
            const errorLevel = document.getElementById('errorLevel').value;
            const colorDark = document.getElementById('colorDark').value;
            const colorLight = document.getElementById('colorLight').value;

            if (!text) {
                showAlert('Please enter text or URL', 'error');
                document.getElementById('text').focus();
                return;
            }

            try {
                currentText = text;
                const errorLevelMap = {
                    'L': QRCode.CorrectLevel.L,
                    'M': QRCode.CorrectLevel.M,
                    'Q': QRCode.CorrectLevel.Q,
                    'H': QRCode.CorrectLevel.H
                };

                document.getElementById('qrcode').innerHTML = '';
                qrCode = new QRCode(document.getElementById('qrcode'), {
                    text: text,
                    width: size,
                    height: size,
                    colorDark: colorDark,
                    colorLight: colorLight,
                    correctLevel: errorLevelMap[errorLevel]
                });

                document.getElementById('qrInfo').textContent = `QR Code generated for: "${text.substring(0, 50)}${text.length > 50 ? '...' : ''}"`;
                document.getElementById('previewActions').style.display = 'flex';
                showAlert('QR Code generated successfully!');
            } catch (error) {
                showAlert('Error generating QR Code: ' + error.message, 'error');
            }
        }

        function resetForm() {
            document.getElementById('qrForm').reset();
            document.getElementById('colorDarkText').value = '#000000';
            document.getElementById('colorLightText').value = '#ffffff';
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrInfo').textContent = 'Enter text or URL above and click "Generate QR Code"';
            document.getElementById('previewActions').style.display = 'none';
            currentText = '';
        }

        function downloadQR() {
            const svg = document.getElementById('qrcode').querySelector('svg');
            if (!svg) {
                showAlert('No QR Code to download', 'error');
                return;
            }

            try {
                const svgData = new XMLSerializer().serializeToString(svg);
                const canvas = document.createElement('canvas');
                const size = parseInt(document.getElementById('size').value);
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const img = new Image();
                img.onload = function () {
                    ctx.drawImage(img, 0, 0);
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = `qrcode-${Date.now()}.png`;
                    link.click();
                    showAlert('QR Code downloaded successfully!');
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
            } catch (error) {
                showAlert('Error downloading QR Code: ' + error.message, 'error');
            }
        }

        function copySVG() {
            const svg = document.getElementById('qrcode').querySelector('svg');
            if (!svg) {
                showAlert('No QR Code to copy', 'error');
                return;
            }

            try {
                const svgData = new XMLSerializer().serializeToString(svg);
                navigator.clipboard.writeText(svgData).then(() => {
                    showAlert('SVG copied to clipboard!');
                });
            } catch (error) {
                showAlert('Error copying SVG: ' + error.message, 'error');
            }
        }

        // Real-time generation on input
        document.getElementById('text').addEventListener('input', debounce(generateQR, 500));
        document.getElementById('size').addEventListener('change', generateQR);
        document.getElementById('errorLevel').addEventListener('change', generateQR);
        document.getElementById('colorDark').addEventListener('change', generateQR);
        document.getElementById('colorLight').addEventListener('change', generateQR);

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Back to top functionality
        const backToTopButton = document.getElementById('backToTop');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopButton.classList.add('show');
            } else {
                backToTopButton.classList.remove('show');
            }
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
