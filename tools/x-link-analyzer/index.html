<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Analyze X / Twitter links, remove trackers, and customize share parameters.">
  <title>X Link Analyzer</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QM106YDX6N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QM106YDX6N');
  </script>

  <link href="images/favicon.ico" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --bg-elevated: #0c1018;
      --card: #111827;
      --border: rgba(148, 163, 184, 0.1);
      --border-strong: rgba(148, 163, 184, 0.18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --accent: #1d9bf0;
      --accent2: #8ecdf8;
      --accent-soft: rgba(29, 155, 240, 0.12);
      --success: #00ba7c;
      --danger: #f4212e;
      --radius: 16px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }

    html { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(29, 155, 240, 0.12), transparent),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(142, 205, 248, 0.06), transparent);
      display: flex;
      justify-content: center;
      padding: 28px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    /* Header */
    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d9bf0, #0ea5e9);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(29, 155, 240, 0.3);
    }
    .icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #e0f2fe, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      min-height: 80px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease;
      line-height: 1.45;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--dim); }

    .actions {
      display: flex;
      gap: 8px;
      margin: 14px 0 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 11px 18px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1d9bf0, #0ea5e9);
      color: #fff;
      box-shadow: 0 4px 14px rgba(29, 155, 240, 0.3);
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .advanced-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
    }
    .advanced-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* Result blocks */
    .result {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      margin-top: 14px;
    }
    .result h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent2);
    }
    .param {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .param:last-child { border-bottom: none; }
    .param-label {
      font-weight: 600;
      color: var(--dim);
      min-width: 120px;
      flex-shrink: 0;
    }
    .param-value {
      flex: 1;
      word-break: break-all;
      text-align: right;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent2);
      border: 1px solid rgba(29, 155, 240, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    .explanation {
      margin-top: 14px;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #e7e9ea;
    }
    .explanation code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      background: rgba(0,0,0,0.25);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .clean-url {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      word-break: break-all;
      margin-top: 8px;
      border: 1px dashed rgba(29, 155, 240, 0.3);
      color: var(--accent2);
      line-height: 1.45;
    }

    /* Customize panel */
    .customize {
      margin-top: 14px;
      padding: 18px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .customize h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--accent2);
    }
    .customize label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.8rem;
      color: var(--dim);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .customize select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .customize select:focus { border-color: var(--accent); }
    .customize .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 6px;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
    }
    .customize .check-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    .customize .row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    /* Powered */
    .powered {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--dim);
    }
    .powered a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .powered a:hover { text-decoration: underline; }
    .powered svg { width: 13px; height: 13px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #0f172a;
      color: #f1f5f9;
      padding: 13px 22px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      font-size: 0.92rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 90vw;
      text-align: center;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }

    @media (max-width: 480px) {
      .card { padding: 18px 14px; }
      .actions { gap: 6px; }
      button { padding: 10px 14px; font-size: 0.85rem; }
      .param { flex-direction: column; gap: 4px; }
      .param-value { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </div>
      <h1>X Link Analyzer</h1>
      <p class="subtitle">Paste any X / Twitter post link. Analyze trackers, clean them, or customize the URL.</p>
    </div>

    <div class="card">
      <textarea id="input" placeholder="https://x.com/username/status/1234567890123456789?s=20&t=abc123"></textarea>

      <div class="actions">
        <button class="btn-primary" onclick="analyze()">Analyze Link</button>
        <button class="btn-secondary" onclick="clean()">Clean Trackers</button>
        <button class="btn-secondary" onclick="copyResult()">Copy Cleaned</button>
      </div>

      <label class="advanced-toggle">
        <input type="checkbox" id="advanced" onchange="if(lastUrl) analyze()">
        Show advanced details
      </label>

      <div id="output"></div>

      <!-- Customize Panel -->
      <div class="customize" id="customizePanel" style="display:none;">
        <h3>Customize Link</h3>

        <label>Change share source (s=)</label>
        <select id="sSelect">
          <option value="">— Keep current / None —</option>
          <option value="19">19 — Android Copy link</option>
          <option value="20">20 — Web Desktop Copy link</option>
          <option value="21">21 — Web newer UI Copy link</option>
          <option value="46">46 — iPhone App Copy link</option>
          <option value="12">12 — iOS Share sheet</option>
          <option value="09">09 — iOS older share menu</option>
          <option value="17">17 — Web Email share</option>
          <option value="18">18 — Web Download / Direct</option>
          <option value="41">41 — Gryphon (3rd-party iOS)</option>
        </select>

        <label class="check-row">
          <input type="checkbox" id="removeToken" checked>
          Remove tracking token (t= / a=)
        </label>

        <div class="row">
          <button class="btn-primary" onclick="applyCustomize()">Apply Changes</button>
          <button class="btn-secondary" onclick="copyCustom()">Copy Custom Link</button>
        </div>
        <div id="customPreview" class="clean-url" style="display:none;"></div>
      </div>
    </div>

    <div class="powered">
      Powered by
      <a href="https://niti.com.ng/" target="_blank" rel="noopener">
        Neroitech Inventions
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const sMap = {
      "09": "iOS (older app) — original share menu",
      "12": "iOS — share sheet",
      "17": "Web Desktop — Email share",
      "18": "Web Desktop — Download / Direct",
      "19": "Android — Copy link button",
      "20": "Web Desktop — Copy link button (most common)",
      "21": "Web — newer UI Copy link",
      "41": "Gryphon (third-party iOS client) — Copy link",
      "46": "iPhone X app — Copy link button"
    };

    let lastUrl = "";
    let lastClean = "";
    let currentParsed = null;

    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast " + type + " show";
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }

    function analyze() {
      const raw = document.getElementById("input").value.trim();
      if (!raw) return showToast("Paste a link first", "error");
      lastUrl = raw;

      let url;
      try {
        url = new URL(raw.startsWith("http") ? raw : "https://" + raw);
      } catch {
        return showToast("Invalid URL", "error");
      }

      const host = url.hostname.replace("www.", "");
      const isX = host.includes("x.com") || host.includes("twitter.com");
      if (!isX) {
        document.getElementById("output").innerHTML = `<div class="result"><p style="color:var(--danger)">This doesn't look like an X / Twitter link.</p></div>`;
        document.getElementById("customizePanel").style.display = "none";
        return;
      }

      const path = url.pathname;
      const statusMatch = path.match(/\/status\/(\d+)/);
      const statusId = statusMatch ? statusMatch[1] : null;
      const userMatch = path.match(/^\/([^\/]+)/);
      const username = userMatch ? userMatch[1] : null;

      const params = Object.fromEntries(url.searchParams.entries());
      const s = params.s || params.S || null;
      const t = params.t || params.a || null;

      currentParsed = { url, params, s, t };

      // Snowflake timestamp
      let postTime = null;
      if (statusId && statusId.length > 10) {
        try {
          const ts = (BigInt(statusId) >> 22n) + 1288834974657n;
          postTime = new Date(Number(ts));
        } catch {}
      }

      const advanced = document.getElementById("advanced").checked;

      let html = `<div class="result"><h3>Analysis</h3>`;

      if (username) html += `<div class="param"><span class="param-label">Username</span><span class="param-value">@${username}</span></div>`;
      if (statusId) html += `<div class="param"><span class="param-label">Post ID</span><span class="param-value">${statusId}</span></div>`;
      if (postTime) html += `<div class="param"><span class="param-label">Posted</span><span class="param-value">${postTime.toLocaleString()}</span></div>`;

      if (s) {
        const meaning = sMap[s] || sMap[s.padStart(2,"0")] || "Unknown share source";
        html += `<div class="param"><span class="param-label">s= (share source)</span><span class="param-value">${s} <span class="badge">${meaning}</span></span></div>`;
      }

      if (t) {
        html += `<div class="param"><span class="param-label">t= / a= (token)</span><span class="param-value">${t}</span></div>`;
      }

      if (Object.keys(params).length === 0) {
        html += `<div class="param"><span class="param-label">Trackers</span><span class="param-value" style="color:var(--success)">None detected — already clean</span></div>`;
      }

      html += `</div>`;

      // Explanation
      let expl = "";
      if (s) expl += `The <strong>s=${s}</strong> parameter indicates how the link was shared or copied. `;
      if (t) expl += `The <strong>t=/a=</strong> value is a session/share token used by X for analytics, attribution, and bot detection. It does not reveal personal info to people who receive the link. `;
      if (!s && !t) expl += "No tracking parameters found. This is a clean post link. ";
      expl += "You can safely remove everything after the <code>?</code> — the post will still open normally.";

      html += `<div class="explanation">${expl}</div>`;

      // Cleaned version
      const clean = url.origin + url.pathname;
      lastClean = clean;
      html += `<div class="result" style="margin-top:14px"><h3>Cleaned Link</h3><div class="clean-url">${clean}</div></div>`;

      if (advanced) {
        html += `<div class="result" style="margin-top:14px"><h3>Advanced</h3>`;
        html += `<div class="param"><span class="param-label">Full params</span><span class="param-value" style="font-family:'JetBrains Mono',monospace;font-size:0.8rem">${JSON.stringify(params, null, 2)}</span></div>`;
        if (statusId) html += `<div class="param"><span class="param-label">Snowflake ID</span><span class="param-value">Yes — timestamp extractable</span></div>`;
        html += `<div class="param"><span class="param-label">Original</span><span class="param-value" style="font-size:0.8rem">${raw}</span></div>`;
        html += `</div>`;
      }

      document.getElementById("output").innerHTML = html;

      // Show customize panel and pre-select current s
      document.getElementById("customizePanel").style.display = "block";
      if (s) document.getElementById("sSelect").value = s;
      document.getElementById("customPreview").style.display = "none";
    }

    function clean() {
      if (!lastUrl) return analyze();
      document.getElementById("input").value = lastClean || lastUrl.split("?")[0];
      analyze();
      showToast("Trackers removed");
    }

    function copyResult() {
      const text = lastClean || document.getElementById("input").value.split("?")[0];
      navigator.clipboard.writeText(text).then(() => showToast("Cleaned link copied!"));
    }

    function applyCustomize() {
      if (!currentParsed) return showToast("Analyze a link first", "error");

      const newS = document.getElementById("sSelect").value;
      const removeToken = document.getElementById("removeToken").checked;

      const base = currentParsed.url.origin + currentParsed.url.pathname;
      const newParams = new URLSearchParams();

      if (newS) {
        newParams.set("s", newS);
      }

      if (!removeToken && currentParsed.t) {
        const originalParams = currentParsed.url.searchParams;
        if (originalParams.has("t")) newParams.set("t", currentParsed.t);
        else if (originalParams.has("a")) newParams.set("a", currentParsed.t);
      }

      const customUrl = newParams.toString() ? `${base}?${newParams.toString()}` : base;

      const preview = document.getElementById("customPreview");
      preview.textContent = customUrl;
      preview.style.display = "block";

      showToast("Custom link generated");
    }

    function copyCustom() {
      const preview = document.getElementById("customPreview");
      if (!preview.textContent || preview.style.display === "none") {
        return showToast("Apply changes first", "error");
      }
      navigator.clipboard.writeText(preview.textContent).then(() => showToast("Custom link copied!"));
    }
  </script>
</body>
</html>
