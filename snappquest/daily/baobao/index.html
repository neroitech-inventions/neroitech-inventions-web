<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script defer data-domain="niti.com.ng" src="https://analytics.vgdh.io/js/script.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnappQuest Daily</title>
<link rel="icon" href="img/icon.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080512;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --accent: #8b5cf6;
    --accent2: #06b6d4;
    --accent3: #10b981;
    --text: #f8fafc;
    --muted: rgba(248,250,252,0.45);
    --card-done: rgba(16,185,129,0.08);
    --border-done: rgba(16,185,129,0.4);
  }

  html { scroll-behavior: smooth; }

  body {
    background: #080512;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .syne { font-family: 'Syne', sans-serif; }

  /* GLOW BLOBS */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(120px); pointer-events: none; z-index: 0; opacity: 0.15;
  }
  .blob1 { width: 600px; height: 600px; background: #7c3aed; top: -200px; left: -150px; }
  .blob2 { width: 500px; height: 500px; background: #0891b2; bottom: -150px; right: -150px; }
  .blob3 { width: 350px; height: 350px; background: #059669; top: 45%; left: 45%; }

  /* LAYOUT */
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
    position: relative;
    z-index: 1;
    width: 100%;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2rem;
    gap: 1rem;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-left .eyebrow {
    font-size: 11px; letter-spacing: 0.2em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    animation: blink 2s infinite;
  }
  .header-left h1 {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.55) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    word-break: break-word;
  }
  .header-left p { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .streak-badge {
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 20px; padding: 12px 16px;
    text-align: center; min-width: 82px; flex-shrink: 0;
    cursor: default; position: relative; overflow: hidden;
  }
  .streak-badge::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(251,191,36,0.12), transparent 70%);
  }
  .streak-badge .fire { font-size: 22px; display: block; animation: pulse 2s ease-in-out infinite; }
  .streak-badge .num { font-size: 26px; font-weight: 700; color: #fbbf24; font-family: 'Syne', sans-serif; line-height: 1.1; }
  .streak-badge .lbl { font-size: 9px; letter-spacing: 0.12em; color: rgba(251,191,36,0.5); text-transform: uppercase; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18) rotate(-5deg); } }
  @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }

  /* DATE STRIP */
  .date-strip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 1.25rem;
    font-size: 12px; flex-wrap: wrap;
  }
  .date-strip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent3); flex-shrink: 0; animation: blink 2s infinite;
  }
  .date-strip .date-text { color: var(--muted); }
  .date-strip .date-val { color: var(--text); font-weight: 500; margin-left: auto; font-size: 12px; }

  /* PROGRESS CARD */
  .progress-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.25rem 1.25rem; margin-bottom: 1.25rem;
  }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .progress-top .label { font-size: 13px; color: var(--muted); }
  .progress-top .fraction { font-size: 13px; font-weight: 600; color: var(--accent3); }
  .bar-track { height: 6px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #7c3aed, #0891b2, #10b981);
    width: 0%; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .xp-strip { display: flex; gap: 6px; margin-top: 1rem; flex-wrap: wrap; }
  .xp-pip {
    flex: 1; min-width: 36px; height: 28px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--muted); font-weight: 500;
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .xp-pip.earned {
    background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35);
    color: #34d399; transform: scale(1.05);
  }

  /* TASKS */
  .tasks-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }

  .task-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1rem 1rem;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    position: relative; overflow: hidden;
  }
  .task-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(139,92,246,0.06), transparent);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .task-card:hover { border-color: rgba(255,255,255,0.13); transform: translateY(-1px); }
  .task-card:hover::before { opacity: 1; }
  .task-card.done { background: var(--card-done); border-color: var(--border-done); transform: none; }
  .task-card.done::before { opacity: 0 !important; }

  .task-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .task-icon {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .task-label { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.4; min-width: 0; }
  .task-pts {
    font-size: 10px; background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.25); color: #c4b5fd;
    border-radius: 99px; padding: 3px 9px; flex-shrink: 0; transition: all 0.3s;
    white-space: nowrap;
  }
  .task-card.done .task-pts { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: #6ee7b7; }

  .task-input {
    width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-size: 14px; /* 16px prevents zoom on iOS, keep >=16 */
    font-size: max(16px, 13px); /* iOS no-zoom fix */
    font-family: 'Inter', sans-serif; outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    -webkit-appearance: none;
    appearance: none;
  }
  .task-input::placeholder { color: rgba(255,255,255,0.2); }
  .task-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.12); }
  .task-card.done .task-input { border-color: rgba(16,185,129,0.25); }

  .check-badge {
    position: absolute; top: 12px; right: 12px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent3); display: none;
    align-items: center; justify-content: center;
    font-size: 11px; color: #fff; box-shadow: 0 0 12px rgba(16,185,129,0.4);
  }
  .task-card.done .check-badge { display: flex; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { 0%{ transform: scale(0); } 100%{ transform: scale(1); } }

  /* BUTTONS */
  .btn-row { display: flex; gap: 10px; margin-bottom: 1.5rem; }
  .btn {
    flex: 1; padding: 14px 10px; border: none; border-radius: 14px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.25s; font-family: 'Inter', sans-serif;
    position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: rgba(255,255,255,0.15); }
  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #0891b2);
    color: #fff; box-shadow: 0 4px 24px rgba(124,58,237,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,58,237,0.45); }
  .btn-primary:active { transform: translateY(0); }

  /* RESULT PANEL */
  .result-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.25rem; margin-bottom: 1.25rem;
    display: none; animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .result-panel.show { display: block; }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .result-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .result-header h3 { font-size: 15px; font-weight: 600; }
  .result-header .total-pts { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent3); }

  .post-box {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 1rem;
    font-size: 12.5px; line-height: 1.85; color: rgba(255,255,255,0.8);
    white-space: pre-wrap; margin-bottom: 1rem; font-family: 'Inter', sans-serif;
    word-break: break-all; overflow-wrap: break-word;
  }

  .result-btns { display: flex; flex-direction: column; gap: 8px; }
  .btn-copy {
    width: 100%; padding: 13px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s; font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn-copy:hover { background: rgba(255,255,255,0.1); }
  .btn-submit {
    width: 100%; display: block; padding: 14px; border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #0891b2);
    color: #fff; font-size: 14px; font-weight: 600;
    text-align: center; text-decoration: none;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(124,58,237,0.25);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }

  /* BACK TO TOP */
  #back-to-top {
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 999;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: #fff;
    background: linear-gradient(135deg, rgba(124,58,237,0.85), rgba(8,145,178,0.85));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 8px 32px rgba(124,58,237,0.45), 0 2px 8px rgba(0,0,0,0.5);
    backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transform: translateY(16px) scale(0.85);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #back-to-top.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  #back-to-top:hover {
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 12px 40px rgba(124,58,237,0.65), 0 2px 8px rgba(0,0,0,0.5);
    transform: translateY(-4px) scale(1.07);
  }
  #back-to-top:active { transform: translateY(-1px) scale(0.97); }
  #back-to-top::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 1.5px solid rgba(139,92,246,0.4);
    opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: scale(0.9);
  }
  #back-to-top:hover::before { opacity: 1; transform: scale(1); }
  #back-to-top::after {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(139,92,246,0.25);
    animation: ringPulse 2.5s ease-out infinite; opacity: 0;
  }
  #back-to-top.visible::after { opacity: 1; }
  @keyframes ringPulse {
    0%   { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.4);  opacity: 0; }
  }

  /* MODAL */
  .modal-bg {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(10px);
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #110c24; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 2rem 1.5rem; max-width: 320px;
    width: 100%; text-align: center;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal .emoji { font-size: 42px; margin-bottom: 1rem; display: block; }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; font-family: 'Syne', sans-serif; }
  .modal p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 13px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .modal-btns button:hover { opacity: 0.85; }
  .modal-cancel { background: rgba(255,255,255,0.08); color: var(--text); }
  .modal-confirm { background: #ef4444; color: #fff; }
  .modal-ok { background: linear-gradient(135deg, #7c3aed, #0891b2); color: #fff; }

  /* FOOTER */
  footer {
    margin-top: auto; padding: 2rem 1rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    text-align: center; position: relative; z-index: 1;
  }
  footer .powered { font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  footer a { color: #a78bfa; text-decoration: none; font-size: 12px; letter-spacing: 0.1em; font-weight: 600; transition: color 0.2s; }
  footer a:hover { color: #c4b5fd; }

  /* ── MOBILE RESPONSIVE ── */
  @media (max-width: 480px) {
    .wrap { padding: 1.5rem 1rem 4rem; }

    .header { margin-bottom: 1.5rem; gap: 0.75rem; }
    .header-left h1 { font-size: clamp(1.6rem, 8vw, 2.2rem); }
    .header-left p { font-size: 12px; margin-top: 6px; }

    .streak-badge { padding: 10px 12px; min-width: 74px; border-radius: 16px; }
    .streak-badge .fire { font-size: 20px; }
    .streak-badge .num { font-size: 22px; }

    .date-strip { padding: 8px 12px; gap: 8px; }
    .date-strip .date-val { font-size: 11px; }

    .progress-card { padding: 1rem; border-radius: 16px; }

    .xp-strip { gap: 4px; }
    .xp-pip { font-size: 9px; height: 26px; min-width: 30px; }

    .task-card { padding: 0.875rem 0.875rem; border-radius: 14px; }
    .task-top { gap: 8px; margin-bottom: 8px; }
    .task-icon { width: 32px; height: 32px; border-radius: 9px; font-size: 14px; }
    .task-label { font-size: 12.5px; }
    .task-pts { font-size: 10px; padding: 2px 8px; }

    .task-input {
      font-size: 16px; /* Critical: prevents iOS zoom on focus */
      padding: 10px 12px;
    }

    .btn-row { gap: 8px; }
    .btn { padding: 13px 8px; font-size: 12px; border-radius: 12px; gap: 5px; }

    .result-panel { padding: 1rem; border-radius: 16px; }
    .post-box { font-size: 12px; padding: 0.875rem; }

    #back-to-top { width: 44px; height: 44px; font-size: 15px; bottom: 20px; right: 16px; }

    .modal { padding: 1.5rem 1.25rem; border-radius: 20px; }
    .modal .emoji { font-size: 36px; }
    .modal h3 { font-size: 17px; }
  }

  @media (max-width: 360px) {
    .header-left h1 { font-size: 1.5rem; }
    .btn { font-size: 11px; padding: 12px 6px; }
    .streak-badge { min-width: 68px; }
    .streak-badge .num { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="eyebrow"><span class="eyebrow-dot"></span> Daily Quest</div>
      <h1 class="syne" id="proj-title">SnappQuest Daily</h1>
      <p id="proj-tagline">Consistency is the real flex.</p>
    </div>
    <div class="streak-badge">
      <span class="fire">🔥</span>
      <div class="num" id="streak-num">0</div>
      <div class="lbl">Day Streak</div>
    </div>
  </div>

  <!-- DATE -->
  <div class="date-strip">
    <div class="dot"></div>
    <span class="date-text">Active Day</span>
    <span class="date-val" id="today-label"></span>
  </div>

  <!-- PROGRESS -->
  <div class="progress-card">
    <div class="progress-top">
      <span class="label">Today's Progress</span>
      <span class="fraction" id="frac">0 / 6</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="prog-bar"></div></div>
    <div class="xp-strip" id="xp-strip"></div>
  </div>

  <!-- TASKS -->
  <div class="tasks-section" id="task-list"></div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-ghost" id="btn-start">🌅 Start Fresh Day</button>
    <button class="btn btn-primary" id="btn-end">🌟 End My Day</button>
  </div>

  <!-- RESULT -->
  <div class="result-panel" id="result-panel">
    <div class="result-header">
      <span style="font-size:20px">🏆</span>
      <h3>Your Daily Proof Post</h3>
      <span class="total-pts" id="total-pts-display"></span>
    </div>
    <div class="post-box" id="post-box"></div>
    <div class="result-btns">
      <button class="btn-copy" id="btn-copy">
        <i class="fa-solid fa-copy"></i> Copy to Clipboard
      </button>
      <a class="btn-submit" id="submit-link" href="#" target="_blank">
        Submit to <span id="submit-proj-name"></span> →
      </a>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <div class="powered">Powered by</div>
  <a href="https://niti.com.ng/" target="_blank">NEROITECH INVENTIONS</a>
</footer>

<!-- BACK TO TOP -->
<button id="back-to-top" title="Back to top" aria-label="Back to top">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<!-- MODALS -->
<div class="modal-bg" id="modal-start">
  <div class="modal">
    <span class="emoji">🌅</span>
    <h3>Start a Fresh Day?</h3>
    <p>This will clear all your task links from today.<br>Your streak is safe.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('modal-start')">Cancel</button>
      <button class="modal-confirm" onclick="confirmStart()">Yes, Reset</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-incomplete">
  <div class="modal">
    <span class="emoji">😤</span>
    <h3>Almost There!</h3>
    <p id="modal-incomplete-text"></p>
    <div class="modal-btns">
      <button class="modal-ok" style="flex:1" onclick="closeModal('modal-incomplete')">Keep Going 💪</button>
    </div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════╗
// ║            ⚙️  PROJECT CONFIGURATION                 ║
// ║  Edit only this section to fully customize the app   ║
// ╠══════════════════════════════════════════════════════╣

const CONFIG = {
  PROJECT_NAME: "BAOBAO",
  TAGLINE: "Consistency is the real flex.",
  SUBMISSION_LINK: "https://t.me/BaoBaoBonknew",
  MIN_TASKS_TO_COMPLETE: 4,
};

const TASKS = [
  { id: "gm",        label: "GM the community on Telegram",    icon: "fa-solid fa-hand",          pts: 10, color: "#f59e0b", bg: "rgba(245,158,11,0.12)" },
  { id: "post-x",    label: "Post about us on X (Twitter)",    icon: "fa-brands fa-x-twitter",    pts: 20, color: "#e2e8f0", bg: "rgba(226,232,240,0.08)" },
  { id: "instagram", label: "Post about us on Instagram",      icon: "fa-brands fa-instagram",    pts: 20, color: "#e879f9", bg: "rgba(232,121,249,0.12)" },
  { id: "cmc",       label: "Post on CoinMarketCap community", icon: "fa-solid fa-chart-line",    pts: 15, color: "#38bdf8", bg: "rgba(56,189,248,0.12)" },
  { id: "tiktok",    label: "Create content on TikTok",        icon: "fa-brands fa-tiktok",       pts: 25, color: "#f43f5e", bg: "rgba(244,63,94,0.12)" },
  { id: "whatsapp",  label: "Share on WhatsApp Status",        icon: "fa-brands fa-whatsapp",     pts: 10, color: "#22c55e", bg: "rgba(34,197,94,0.12)" },
];

// ╚══════════════════════════════════════════════════════╝

const KEY = (id) => `sq_${CONFIG.PROJECT_NAME}_${id}`;
let streak     = parseInt(localStorage.getItem(KEY('streak')) || '0');
let lastDate   = localStorage.getItem(KEY('lastdate')) || '';
const todayStr = new Date().toISOString().split('T')[0];

function init() {
  document.getElementById('proj-title').textContent       = CONFIG.PROJECT_NAME + ' Daily';
  document.getElementById('proj-tagline').textContent     = CONFIG.TAGLINE;
  document.getElementById('submit-link').href             = CONFIG.SUBMISSION_LINK;
  document.getElementById('submit-proj-name').textContent = CONFIG.PROJECT_NAME;
  document.getElementById('streak-num').textContent       = streak;
  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('today-label').textContent      = new Date().toLocaleDateString(undefined, opts);
  buildXP();
  renderTasks();
}

function buildXP() {
  const strip = document.getElementById('xp-strip');
  strip.innerHTML = '';
  TASKS.forEach(t => {
    const pip = document.createElement('div');
    pip.className   = 'xp-pip';
    pip.id          = `pip-${t.id}`;
    pip.textContent = `+${t.pts}`;
    strip.appendChild(pip);
  });
}

function renderTasks() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  TASKS.forEach(t => {
    const saved = localStorage.getItem(KEY(t.id)) || '';
    const done  = saved.length > 10;
    const card  = document.createElement('div');
    card.className = 'task-card' + (done ? ' done' : '');
    card.id = `card-${t.id}`;
    card.innerHTML = `
      <div class="check-badge">✓</div>
      <div class="task-top">
        <div class="task-icon" style="background:${t.bg}; color:${t.color};">
          <i class="${t.icon}"></i>
        </div>
        <div class="task-label">${t.label}</div>
        <div class="task-pts">${t.pts} XP</div>
      </div>
      <input class="task-input" id="inp-${t.id}" type="text"
             placeholder="Paste your proof link here...">
    `;
    list.appendChild(card);
    const inp = document.getElementById(`inp-${t.id}`);
    inp.value = saved;
    inp.addEventListener('input', () => onInput(t.id));
  });
  updateProgress();
}

function onInput(id) {
  const val  = document.getElementById(`inp-${id}`).value.trim();
  const card = document.getElementById(`card-${id}`);
  const pip  = document.getElementById(`pip-${id}`);
  const done = val.length > 10;
  card.classList.toggle('done', done);
  pip.classList.toggle('earned', done);
  updateProgress();
}

function updateProgress() {
  let done = 0;
  TASKS.forEach(t => {
    const val = document.getElementById(`inp-${t.id}`)?.value.trim() || '';
    if (val.length > 10) done++;
  });
  document.getElementById('frac').textContent     = `${done} / ${TASKS.length}`;
  document.getElementById('prog-bar').style.width = `${(done / TASKS.length) * 100}%`;
}

function saveTasks() {
  TASKS.forEach(t => {
    const val = document.getElementById(`inp-${t.id}`)?.value.trim() || '';
    if (val) localStorage.setItem(KEY(t.id), val);
    else     localStorage.removeItem(KEY(t.id));
  });
}

function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.getElementById('btn-start').addEventListener('click', () => openModal('modal-start'));

function confirmStart() {
  TASKS.forEach(t => localStorage.removeItem(KEY(t.id)));
  closeModal('modal-start');
  document.getElementById('result-panel').classList.remove('show');
  renderTasks();
  buildXP();
}

document.getElementById('btn-end').addEventListener('click', endDay);

function endDay() {
  saveTasks();
  let done = 0, xp = 0;
  TASKS.forEach(t => {
    const val = localStorage.getItem(KEY(t.id)) || '';
    if (val.length > 10) { done++; xp += t.pts; }
  });

  if (done < CONFIG.MIN_TASKS_TO_COMPLETE) {
    document.getElementById('modal-incomplete-text').innerHTML =
      `You've completed <strong style="color:#f59e0b">${done} of ${TASKS.length}</strong> tasks.<br><br>
       Complete at least <strong style="color:#f59e0b">${CONFIG.MIN_TASKS_TO_COMPLETE}</strong> to keep your streak alive! 🔥`;
    openModal('modal-incomplete');
    return;
  }

  if (lastDate !== todayStr) {
    streak++;
    localStorage.setItem(KEY('streak'), streak);
    localStorage.setItem(KEY('lastdate'), todayStr);
    document.getElementById('streak-num').textContent = streak;
    lastDate = todayStr;
  }

  generatePost(done, xp);
  document.getElementById('result-panel').classList.add('show');
  setTimeout(() => {
    document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);

  confetti({ particleCount: 180, spread: 80, origin: { y: 0.6 } });
  setTimeout(() => confetti({
    particleCount: 80, spread: 120, origin: { y: 0.4 },
    colors: ['#8b5cf6','#06b6d4','#10b981']
  }), 400);
}

function generatePost(done, xp) {
  const lines = [`🚀 ${CONFIG.PROJECT_NAME} Daily Quest — COMPLETE!\n`];
  TASKS.forEach(t => {
    const link = localStorage.getItem(KEY(t.id)) || '';
    if (link) lines.push(`• ${t.label}:\n  ${link}`);
  });
  lines.push(`\n🔥 Streak: ${streak} day${streak !== 1 ? 's' : ''} | ⚡ ${xp} XP earned`);
  lines.push(`\nLet's keep building together! 💜`);
  document.getElementById('post-box').textContent          = lines.join('\n');
  document.getElementById('total-pts-display').textContent = `⚡ ${xp} XP`;
}

document.getElementById('btn-copy').addEventListener('click', function() {
  const text = document.getElementById('post-box').textContent;
  navigator.clipboard.writeText(text).then(() => {
    this.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    setTimeout(() => { this.innerHTML = '<i class="fa-solid fa-copy"></i> Copy to Clipboard'; }, 2000);
  });
});

// BACK TO TOP
const btt = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
  btt.classList.toggle('visible', window.scrollY > 380);
}, { passive: true });
btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

init();
</script>
</body>
</html>
