<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Details - SnappQuest</title>
        <link href="images/icon.png" rel="icon">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            background:
            radial-gradient(circle at top,#312e81 0%,#111827 45%,#030712 100%);
            min-height:100vh;
            padding:20px;
            color:white;
        }

        .container{
            max-width:950px;
            margin:40px auto;
        }

        .card{
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(16px);
            border-radius:28px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
        }

        .header{
            padding:50px 35px;
            background:linear-gradient(135deg,#6366F1,#06B6D4);
            position:relative;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            background:rgba(255,255,255,0.18);
            border:1px solid rgba(255,255,255,0.25);
            padding:10px 16px;
            border-radius:999px;
            font-size:14px;
            font-weight:600;
            margin-bottom:20px;
        }

        .header h1{
            font-size:42px;
            line-height:1.2;
            font-weight:800;
        }

        .content{
            padding:35px;
        }

        .back-btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            color:#93C5FD;
            text-decoration:none;
            font-weight:600;
            margin-bottom:30px;
            transition:0.3s;
        }

        .back-btn:hover{
            opacity:0.8;
        }

        .info-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .info-box{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:22px;
        }

        .info-label{
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:1px;
            opacity:0.7;
            margin-bottom:10px;
        }

        .info-value{
            font-size:18px;
            font-weight:700;
            line-height:1.5;
        }

        .description-box{
            background:#ffffff;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:24px;
            padding:30px;
            margin-top:10px;
        }

        .description-title{
            font-size:24px;
            font-weight:800;
            margin-bottom:20px;
        }

        .description{
            font-size:17px;
            color:#000000;
            text-align: left;
            padding: 1px;
            margin: 1px;
        }

        .description a {
    color: seagreen;
    text-decoration: underline;
    transition: 0.3s;
}

.description a:hover {
    opacity: 0.8;
}

        .actions{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            margin-top:35px;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            padding:15px 24px;
            border-radius:16px;
            text-decoration:none;
            font-weight:700;
            transition:0.3s;
            font-size:15px;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .btn-primary{
            background:linear-gradient(135deg,#06B6D4,#2563EB);
            color:white;
        }

        .btn-secondary{
            background:seagreen;
            color:#ffffff;
        }

        .loading{
            text-align:center;
            padding:80px 20px;
            opacity:0.8;
        }

        @media(max-width:768px){

            .header{
                padding:35px 25px;
            }

            .header h1{
                font-size:30px;
            }

            .content{
                padding:25px;
            }

            .description-box{
                padding:22px;
            }

            .btn{
                width:100%;
            }

        }

        #backToTop {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg,#06B6D4,#2563EB);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: 0.3s;
    z-index: 999;
}

#backToTop:hover {
    transform: translateY(-3px);
}

    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="badge">
                <i class="fa-solid fa-bolt"></i>
                Quest Briefing
            </div>

            <h1 id="questTitle">
                Loading Quest...
            </h1>

        </div>

        <div class="content">

            <a href="join.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Quests
            </a>

            <div id="questContent" class="loading">
                Loading quest details...
            </div>

        </div>

    </div>

</div>

<script>

const CONFIG = {
    API_KEY: 'AIzaSyCs8fSiITdfU4WyZRgKsWRlbhAKeJaVC0Q',
    DETAILED_QUESTS_ID: '1p3C_hTx6_KSZz4cEnGdOb1x8O7me-UEz0jgVWnb7FeM',
    DETAILED_RANGE: 'Quests!A:G'
};

async function loadQuest() {

    const params = new URLSearchParams(window.location.search);
    const trackCode = params.get('track');

    if (!trackCode) {

        document.getElementById('questContent').innerHTML = `
            <div class="description-box">
                No track code found in URL.
            </div>
        `;

        return;
    }

    try {

        const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.DETAILED_QUESTS_ID}/values/${CONFIG.DETAILED_RANGE}?key=${CONFIG.API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.values) {

            document.getElementById('questContent').innerHTML = `
                <div class="description-box">
                    No quest data found.
                </div>
            `;

            return;
        }

        const rows = data.values.slice(1);

        let found = false;

        rows.forEach(row => {

            const code = row[0] || '';
            const title = row[1] || 'Untitled Quest';
            const sponsor = row[2] || 'Unknown Sponsor';
            const description = row[3] || 'No description available.';
            const rewards = row[4] || 'No rewards specified.';
            const  viewQuestLink= row[5] || '#';
            const submitLink = row[6] || '#';

            if (code.trim().toLowerCase() === trackCode.trim().toLowerCase()) {

                found = true;

                document.getElementById('questTitle').innerText = title;

                document.getElementById('questContent').innerHTML = `

                    <div class="info-grid">

                        <div class="info-box">
                            <div class="info-label">
                                Sponsor
                            </div>

                            <div class="info-value">
                                ${sponsor}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">
                                Rewards
                            </div>

                            <div class="info-value">
                                ${rewards}
                            </div>
                        </div>

                    </div>

                    <div class="description-box">

                        <div class="description-title">
                            Quest Instructions
                        </div>

                        <div class="description">
                            ${description.replace(/\n/g, '<br><br>')}
                        </div>

                       <div class="actions">

    ${viewQuestLink !== '#' ? `

    <a href="${viewQuestLink}"
       target="_blank"
       class="btn btn-primary">

        <i class="fa-solid fa-eye"></i>
        View Quest

    </a>

    ` : ''}

    ${submitLink !== '#' ? `

    <a href="${submitLink}"
       target="_blank"
       class="btn btn-secondary">

        <i class="fa-solid fa-paper-plane"></i>
        Submit Quest

    </a>

    ` : ''}

</div>

                    </div>

                `;
            }

        });

        if (!found) {

            document.getElementById('questContent').innerHTML = `
                <div class="description-box">
                    Quest not found.
                </div>
            `;

        }

    } catch (e) {

        console.error(e);

        document.getElementById('questContent').innerHTML = `
            <div class="description-box">
                Unable to load quest details.
            </div>
        `;

    }

}




window.onload = () => {

    loadQuest();

    const backToTopBtn = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {

        if (window.scrollY > 300) {
            backToTopBtn.style.display = 'flex';
        } else {
            backToTopBtn.style.display = 'none';
        }

    });

    backToTopBtn.addEventListener('click', () => {

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    });

};


</script>

<button id="backToTop">
    <i class="fa-solid fa-arrow-up"></i>
</button>

</body>
</html>
