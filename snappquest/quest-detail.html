        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root {
            --color-dark-bg: #0F172A; /* Slate 900 */
            --color-light-bg: #1E293B; /* Slate 800 */
            --color-text-primary: #F8FAFC; /* Slate 50 */
            --color-text-secondary: #94A3B8; /* Slate 400 */
            --color-indigo: #6366F1; /* Indigo 500 */
            --color-teal: #34D399; /* Teal 400 */
            --color-gradient-primary: linear-gradient(135deg, var(--color-indigo), var(--color-teal));
        }

        body{
            font-family:'Inter',sans-serif;
            background-color: var(--color-dark-bg);
            min-height:100vh;
            padding:20px;
            color:white;
        }

        .container{
            max-width:950px;
            margin:40px auto;
        }

        .card{
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(16px);
            border-radius:28px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
        }

        .header{
            padding:50px 35px;
            background:linear-gradient(135deg,#6366F1,#06B6D4);
            position:relative;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            background:rgba(255,255,255,0.18);
            border:1px solid rgba(255,255,255,0.25);
            padding:10px 16px;
            border-radius:999px;
            font-size:14px;
            font-weight:600;
            margin-bottom:20px;
        }

        .header h1{
            font-size:42px;
            line-height:1.2;
            font-weight:800;
        }

        .content{
            padding:35px;
        }

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 22px;
    margin-bottom:30px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);

    border-radius:18px;

    color:#ffffff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.08);

    transition:all 0.3s ease;
}

.back-btn i{
    font-size:14px;
    transition:transform 0.3s ease;
}

.back-btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.12);
    border-color:rgba(255,255,255,0.22);

    box-shadow:
    0 16px 35px rgba(37,99,235,0.35),
    inset 0 1px 0 rgba(255,255,255,0.12);
}

.back-btn:hover i{
    transform:translateX(-3px);
}

        .info-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .info-box{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:22px;
        }

        .info-label{
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:1px;
            opacity:0.7;
            margin-bottom:10px;
        }

        .info-value{
            font-size:18px;
            font-weight:700;
            line-height:1.5;
        }

        .description-box{
            background:#ffffff !important;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:24px;
            padding:30px;
            margin-top:10px;
            opacity: 1.0;
        }

        .description-title{
            font-size:24px;
            font-weight:800;
            margin-bottom:20px;
            color: #000000;
        }

        .description{
            font-size:17px;
            color:#000000;
            text-align: left;
            padding: 1px;
            margin: 1px;
        }

        .description a {
    color: seagreen;
    text-decoration: underline;
    transition: 0.3s;
}

.description a:hover {
    opacity: 0.8;
}

        .actions{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            margin-top:35px;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            padding:15px 24px;
            border-radius:16px;
            text-decoration:none;
            font-weight:700;
            transition:0.3s;
            font-size:15px;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .btn-primary{
            background:linear-gradient(135deg,#06B6D4,#2563EB);
            color:white;
        }

        .btn-secondary{
            background:#2563EB;
            color:#ffffff;
        }

        .loading{
            text-align:center;
            padding:80px 20px;
            opacity:0.8;
        }

@media(max-width:768px){

        padding:0;
        color:#ffffff;
    }

    .container{
        max-width:100%;
        margin:0;
    }

    .card{
        background:white;
        border:none;
        border-radius:0;
        box-shadow:none;
        overflow:visible;
    }

    .header{
        padding:30px 22px;
        border-radius:0 0 28px 28px;
    }

    .header h1{
        font-size:28px;
        line-height:1.3;
    }

    .content{
        padding:20px;
    }

    .back-btn{
        width:100%;
        justify-content:center;

        margin-bottom:20px;

        background:linear-gradient(135deg,#2563EB,#06B6D4);

        color:white;

        border:none;

        box-shadow:0 10px 25px rgba(37,99,235,0.25);
    }

    .info-grid{
        grid-template-columns:1fr;
        gap:14px;
    }

    .info-box{
        background:#F8FAFC;
        border:none;
        color:#111827;
    }

    .description-box{
        background:white;
        border:none;

        border-radius:20px;

        padding:24px 0;

        margin-top:10px;

        width:100%;
    }

    .description{
        font-size:18px;

    }

    .actions .btn{
        width:100%;

        padding:16px 20px;

        border-radius:18px;

        font-size:16px;

        justify-content:center;
    }

    .actions .btn i{
        font-size:18px;
    }

    .back-btn:hover{
    background:linear-gradient(135deg,#2563EB,#06B6D4);

}

.actions .btn:hover{
    transform:none;
}

}

        #backToTop {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg,#06B6D4,#2563EB);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: 0.3s;
    z-index: 999;
}

#backToTop:hover {
    transform: translateY(-3px);
}

.share-btn{
    background:orange;
    color:white;
    border: none;
    cursor: pointer;
}

.share-btn.copied{

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="badge">
                <i class="fa-solid fa-bolt"></i>
                Quest Briefing
            </div>

            <h1 id="questTitle">
                Loading Quest...
            </h1>

        </div>

        <div class="content">

            <a href="join.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Quests
            </a>

            <div id="questContent" class="loading">
                Loading quest details...
            </div>

        </div>

    </div>

</div>

<script>

const CONFIG = {
    API_KEY: 'AIzaSyCs8fSiITdfU4WyZRgKsWRlbhAKeJaVC0Q',
    DETAILED_QUESTS_ID: '1p3C_hTx6_KSZz4cEnGdOb1x8O7me-UEz0jgVWnb7FeM',
    DETAILED_RANGE: 'Quests!A:G'
};

async function loadQuest() {

    const params = new URLSearchParams(window.location.search);
    const trackCode = params.get('track');

    if (!trackCode) {

        document.getElementById('questContent').innerHTML = `
            <div class="description-box">
                No track code found in URL.
            </div>
        `;

        return;
    }

    try {

        const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.DETAILED_QUESTS_ID}/values/${CONFIG.DETAILED_RANGE}?key=${CONFIG.API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.values) {

            document.getElementById('questContent').innerHTML = `
                <div class="description-box">
                    No quest data found.
                </div>
            `;

            return;
        }

        const rows = data.values.slice(1);

        let found = false;

        rows.forEach(row => {

            const code = row[0] || '';
            const title = row[1] || 'Untitled Quest';
            const sponsor = row[2] || 'Unknown Sponsor';
            const description = row[3] || 'No description available.';
            const rewards = row[4] || 'No rewards specified.';
            const  viewQuestLink= row[5] || '#';
            const submitLink = row[6] || '#';

            if (code.trim().toLowerCase() === trackCode.trim().toLowerCase()) {

                found = true;

                document.getElementById('questTitle').innerText = title;

                document.getElementById('questContent').innerHTML = `

                    <div class="info-grid">

                        <div class="info-box">
                            <div class="info-label">
                                Sponsor
                            </div>

                            <div class="info-value">
                                ${sponsor}
                            </div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">
                                Rewards
                            </div>

                            <div class="info-value">
                                ${rewards}
                            </div>
                        </div>

                    </div>

                    <div class="description-box">

                        <div class="description">
                            ${description.replace(/\n/g, '<br><br>')}
                        </div>

                       <div class="actions">

    ${viewQuestLink !== '#' ? `

    <a href="${viewQuestLink}"
       target="_blank"
       class="btn btn-primary">

        <i class="fa-solid fa-eye"></i>
        View Quest

    </a>

    ` : ''}

${submitLink !== '#' ? `

<a href="${submitLink}"
   target="_blank"
   class="btn btn-secondary">

    <i class="fa-solid fa-paper-plane"></i>
    Submit Quest

</a>

` : ''}

<button
    onclick="shareQuest(this)"
    class="btn share-btn"
    type="button">

    <i class="fa-solid fa-share-nodes"></i>
    Share

</button>

</div>

                    </div>

                `;
            }

        });

        if (!found) {

            document.getElementById('questContent').innerHTML = `
<div class="description-box" style="text-align:center;">

    <h2 style="font-size:28px;font-weight:800;margin-bottom:12px;color:#111827;">
        No Quest Found
    </h2>

    <p style="font-size:16px;color:#6B7280;">
        The quest you're trying to access does not exist or may have been removed.
    </p>

</div>
            `;

        }

    } catch (e) {

        console.error(e);

        document.getElementById('questContent').innerHTML = `
            <div class="description-box">
                Unable to load quest details.
            </div>
        `;

    }

}




async function shareQuest(button) {

    const originalHTML = button.innerHTML;

    try {

        await navigator.clipboard.writeText(window.location.href);

        button.innerHTML = `
            <i class="fa-solid fa-check"></i>
            Copied
        `;

        button.classList.add('copied');

        setTimeout(() => {

            button.innerHTML = originalHTML;

            button.classList.remove('copied');

        }, 2200);

    } catch(err) {

        console.log(err);

    }

}

window.onload = () => {

    loadQuest();

    const backToTopBtn = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {

        if (window.scrollY > 300) {
            backToTopBtn.style.display = 'flex';
        } else {
            backToTopBtn.style.display = 'none';
        }

    });

    backToTopBtn.addEventListener('click', () => {

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    });

};


</script>

<button id="backToTop">
    <i class="fa-solid fa-arrow-up"></i>
</button>

</body>
</html>
