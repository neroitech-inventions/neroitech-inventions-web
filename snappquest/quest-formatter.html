<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SnappQuest Quest Formatter</title>
        <link href="images/icon.png" rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020617;
    --card:rgba(15,23,42,0.78);
    --border:rgba(255,255,255,0.08);
    --text:#F8FAFC;
    --muted:#94A3B8;

    --primary:#6366F1;
    --secondary:#06B6D4;
    --success:#10B981;

    --gradient:
    linear-gradient(
        135deg,
        #6366F1,
        #06B6D4
    );
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top left, rgba(99,102,241,0.25), transparent 35%),
    radial-gradient(circle at bottom right, rgba(6,182,212,0.18), transparent 35%),
    var(--bg);

    color:var(--text);

    min-height:100vh;

    padding:30px;
}

.container{
    max-width:1450px;
    margin:auto;
}

.hero{
    text-align:center;
    margin-bottom:40px;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:12px 18px;

    border-radius:999px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    margin-bottom:20px;

    font-size:14px;
    font-weight:600;

    color:#CBD5E1;

    backdrop-filter:blur(12px);
}

.hero h1{
    font-size:60px;
    font-weight:900;
    line-height:1.1;

    background:var(--gradient);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:var(--muted);
    margin-top:18px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
}

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:30px;

    padding:30px;

    backdrop-filter:blur(18px);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.45);
}

.section-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:25px;
}

label{
    display:block;

    margin-bottom:10px;

    color:#CBD5E1;

    font-size:14px;
    font-weight:700;
}

.input-group{
    margin-bottom:22px;
}

input,
textarea{
    width:100%;

    background:rgba(2,6,23,0.85);

    border:1px solid rgba(255,255,255,0.06);

    border-radius:20px;

    padding:18px;

    color:white;

    outline:none;

    transition:0.3s;

    font-size:15px;
    font-family:'Inter',sans-serif;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#6366F1;

    box-shadow:
    0 0 0 4px rgba(99,102,241,0.15);
}

.generate-btn{
    width:100%;

    border:none;

    padding:18px;

    border-radius:20px;

    background:var(--gradient);

    color:white;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 10px 30px rgba(99,102,241,0.35);
}

.generate-btn:hover{
    transform:translateY(-3px);
}

.output-wrapper{
    position:relative;
}

.output-box{
    background:white;

    color:#000;

    border-radius:24px;

    padding:30px;

    min-height:720px;

    overflow:auto;

    white-space:pre-wrap;

    line-height:1.8;

    font-size:14px;

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8);
}

.output-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.copy-btn{
    border:none;

    background:linear-gradient(
        135deg,
        #10B981,
        #059669
    );

    color:white;

    padding:14px 18px;

    border-radius:16px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;
}

.copy-btn:hover{
    transform:translateY(-2px);
}

.copy-btn.copied{
    background:
    linear-gradient(
        135deg,
        #22C55E,
        #16A34A
    );
}

.glow{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;

    filter:blur(120px);

    opacity:0.18;

    z-index:-1;
}

.glow.one{
    background:#6366F1;
    top:-100px;
    left:-100px;
}

.glow.two{
    background:#06B6D4;
    bottom:-100px;
    right:-100px;
}

/* Back To Top */

#backToTop{
    position:fixed;

    bottom:28px;
    right:28px;

    width:58px;
    height:58px;

    border:none;

    border-radius:50%;

    background:var(--gradient);

    color:white;

    font-size:20px;
    font-weight:900;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 10px 30px rgba(99,102,241,0.35);

    opacity:0;
    visibility:hidden;

    transform:translateY(20px);

    transition:0.35s;

    z-index:999;
}

#backToTop.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

#backToTop:hover{
    transform:translateY(-4px);
}

@media(max-width:980px){

    body{
        padding:18px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:38px;
    }

    .hero p{
        font-size:16px;
    }

    .card{
        padding:22px;
        border-radius:24px;
    }

    .output-box{
        min-height:500px;
    }

}

</style>
</head>
<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <div class="hero">

        <div class="hero-badge">
            ⚡ SnappQuest Creator Tool
        </div>

        <h1>
            Quest HTML Formatter
        </h1>

        <p>
            Turn plain text into beautiful formatted SnappQuest HTML instantly.
        </p>

    </div>

    <div class="grid">

        <!-- LEFT -->

        <div class="card">

            <div class="section-title">
                Quest Information
            </div>

            <div class="input-group">
                <label>Quest Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="SnappQuest Feedback Quest"
                >
            </div>

            <div class="input-group">
                <label>About This Quest</label>

                <textarea
                    id="about"
                    placeholder="Write details about the quest..."
                ></textarea>
            </div>

            <div class="input-group">
                <label>How to Participate</label>

                <textarea
                    id="steps"
                    placeholder="One step per line..."
                ></textarea>
            </div>

            <div class="input-group">
                <label>Reward</label>

                <textarea
                    id="reward"
                    placeholder="Example: • 1,500 VERSE"
                ></textarea>
            </div>

            <div class="input-group">
                <label>Requirements</label>

                <textarea
                    id="requirements"
                    placeholder="One requirement per line..."
                ></textarea>
            </div>

            <div class="input-group">
                <label>Goal</label>

                <textarea
                    id="goal"
                    placeholder="What is the purpose of this quest?"
                ></textarea>
            </div>

            <button
                class="generate-btn"
                onclick="generateHTML()"
            >
                ✨ Generate HTML
            </button>

        </div>

        <!-- RIGHT -->

        <div class="card">

            <div class="output-top">

                <div class="section-title">
                    Generated HTML
                </div>

                <button
                    class="copy-btn"
                    id="copyBtn"
                    onclick="copyHTML()"
                >
                    📋 Copy HTML
                </button>

            </div>

            <div class="output-wrapper">

                <div
                    id="output"
                    class="output-box"
                >
Your generated HTML will appear here...
                </div>

            </div>

        </div>

    </div>

</div>

<button id="backToTop">
    ↑
</button>

<script>

function formatLines(text){

    return text
        .split('\n')
        .filter(line => line.trim() !== '')
        .map(line => `• ${line}`)
        .join('<br>');

}

function formatSteps(text){

    const lines = text
        .split('\n')
        .filter(line => line.trim() !== '');

    return lines.map((line,index) => {

        return `<b>Step ${index + 1}:</b> ${line}`;

    }).join('<br>');

}

function generateHTML(){

    const title =
    document.getElementById('title').value;

    const about =
    document.getElementById('about').value;

    const steps =
    document.getElementById('steps').value;

    const reward =
    document.getElementById('reward').value;

    const requirements =
    document.getElementById('requirements').value;

    const goal =
    document.getElementById('goal').value;

    const html = `

<span style="font-size:30px;font-weight:bold;">${title}</span>

<hr><br>

<span style="font-size:20px;font-weight:bold;">About This Quest</span><br>
${about}

<hr><br>

<span style="font-size:20px;font-weight:bold;">How to Participate</span><br>
${formatSteps(steps)}

<hr><br>

<span style="font-size:20px;font-weight:bold;">Reward</span><br>
${reward}

<hr><br>

<span style="font-size:20px;font-weight:bold;">Requirements</span><br>
${formatLines(requirements)}

<hr><br>

<span style="font-size:20px;font-weight:bold;">Goal</span><br>
${goal}

`;

    document.getElementById('output').textContent = html;

}

async function copyHTML(){

    const text =
    document.getElementById('output').textContent;

    await navigator.clipboard.writeText(text);

    const btn =
    document.getElementById('copyBtn');

    btn.innerHTML = '✅ Copied';

    btn.classList.add('copied');

    setTimeout(() => {

        btn.innerHTML = '📋 Copy HTML';

        btn.classList.remove('copied');

    }, 2200);

}
/* Back To Top */

const backToTop =
document.getElementById('backToTop');

window.addEventListener('scroll', () => {

    if(window.scrollY > 300){

        backToTop.classList.add('show');

    }else{

        backToTop.classList.remove('show');

    }

});

backToTop.addEventListener('click', () => {

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

});
</script>

</body>
</html>
