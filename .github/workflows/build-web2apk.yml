# Web2APK Studio - GitHub Actions Workflow Fix 3
#
# Replace the entire contents of:
# .github/workflows/build-web2apk.yml
#
# This version avoids the `yes` command's Broken pipe error by sending a
# finite number of license-acceptance responses to sdkmanager.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Public HTTPS website URL"
        required: true
        type: string
      app_name:
        description: "Android app name"
        required: true
        type: string
      package_id:
        description: "Android package ID (for example com.example.myapp)"
        required: true
        type: string
      theme:
        description: "App theme"
        required: false
        default: "light"
        type: choice
        options:
          - light
          - dark

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..50}; do printf 'y\n'; done | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node web2apk-studio/scripts/generate-android.mjs \
            --url "${{ inputs.website_url }}" \
            --name "${{ inputs.app_name }}" \
            --package "${{ inputs.package_id }}" \
            --theme "${{ inputs.theme }}"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-project
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
